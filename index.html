                                    <p className={`text-[8px] font-medium ${m.textL}`}>{m.label}</p>
                                    <p className={`text-[11px] font-bold ${m.textV}`}>{m.value}</p>
                                </div>
                            ))} 
                        </div> 
                    )}
                </div>
            );
        }

        function SimulatorParamsPanel({ engine, simForm, setSimForm, simParams, nodes, selectedNode, selectedProd, cascadeDelete, logistics }) {
            return (
                <div className={`transition-all duration-500 ease-in-out bg-orange-50/50 rounded flex flex-col shadow-sm max-h-[85vh] overflow-hidden ${engine.showParamsPanel ? 'w-full md:w-1/4 md:min-w-[250px] md:max-w-[400px] border border-orange-200 p-2 opacity-100' : 'w-0 min-w-0 max-w-0 border-0 p-0 opacity-0'}`}>
                    <div className="min-w-[220px] h-full flex flex-col overflow-y-auto pr-1">
                        <h3 className="font-bold text-orange-900 text-xs mb-2 border-b border-orange-200 pb-1 flex-shrink-0">Parámetros Logísticos</h3>
                        <div className="grid grid-cols-2 gap-1 mb-1.5 flex-shrink-0">
                            <div><label className="block text-[9px] font-medium text-gray-600 mb-0.5">Tipo Abast.</label><select value={simForm.supplyType} onChange={e=>setSimForm({...simForm, supplyType: e.target.value, supplier: e.target.value === 'Distribuido' ? '' : simForm.supplier})} className="w-full border p-1 rounded text-[10px] bg-white"><option value="Comprado">Compra</option><option value="Manufacturado">Manuf.</option><option value="Distribuido">Distrib.</option></select></div>
                            <div>
                                <label className="block text-[9px] font-medium text-gray-600 mb-0.5">Bodega Origen</label>
                                {/* LE QUITAMOS EL disabled */}
                                <select value={simForm.originNode} onChange={e=>setSimForm({...simForm, originNode: e.target.value})} className="w-full border p-1 rounded text-[10px] bg-white">
                                    <option value="">-- Bodega / Externo --</option>
                                    {nodes.filter(n => n.code !== selectedNode).map(n => <option key={n.code} value={n.code}>{n.code} ({n.company||'WA'})</option>)}
                                </select>
                            </div>
                            
                            {/* NATURALEZA DE CONSUMO Y PLANTAS DESTINO */}
                            <div className="col-span-2 bg-green-50 p-1 border border-green-200 rounded">
                                <label className="block text-[9px] font-bold text-green-800 mb-0.5">Naturaleza de Salida (Outbound)</label>
                                <div className="grid grid-cols-2 gap-1 mt-0.5">
                                    {['Venta', 'Consumo Interno', 'Consumo en Producción', 'Distribución'].map(tipo => {
                                        let isChecked = Array.isArray(simForm.consumptionType) && simForm.consumptionType.includes(tipo);
                                        return (
                                            <label key={tipo} className={`flex items-center gap-1 p-0.5 border rounded cursor-pointer text-[8px] font-medium transition-colors ${isChecked ? 'bg-green-600 text-white border-green-700' : 'bg-white text-gray-600 hover:bg-green-100'}`}>
                                                <input 
                                                    type="checkbox" 
                                                    className="hidden"
                                                    checked={isChecked}
                                                    onChange={(e) => {
                                                        let current = Array.isArray(simForm.consumptionType) ? [...simForm.consumptionType] : [];
                                                        let currentPlants = Array.isArray(simForm.consumingPlants) ? [...simForm.consumingPlants] : [];
                                                        if (e.target.checked) {
                                                            current.push(tipo);
                                                        } else {
                                                            current = current.filter(t => t !== tipo);
                                                            if (tipo === 'Consumo en Producción') currentPlants = [];
                                                        }
                                                        setSimForm({...simForm, consumptionType: current, consumingPlants: currentPlants});
                                                    }}
                                                />
                                                {isChecked ? '✓' : '+'} {tipo}
                                            </label>
                                        )
                                    })}
                                </div>
                                
                                {/* SELECTOR DINÁMICO DE PLANTAS DESTINO */}
                                {Array.isArray(simForm.consumptionType) && simForm.consumptionType.includes('Consumo en Producción') && (
                                    <div className="mt-1.5 p-1 bg-white border border-green-300 rounded shadow-inner">
                                        <label className="block text-[8px] font-bold text-green-700 mb-0.5">Seleccione las Plantas destino:</label>
                                        <div className="flex flex-wrap gap-1">
                                            {nodes.filter(n => n.nodeType === 'Planta' && n.code !== selectedNode).map(planta => {
                                                let isPlantChecked = Array.isArray(simForm.consumingPlants) && simForm.consumingPlants.includes(planta.code);
                                                return (
                                                    <label key={planta.code} className={`flex items-center gap-1 px-1 py-0.5 border rounded cursor-pointer text-[7px] font-bold transition-colors ${isPlantChecked ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-gray-50 text-gray-600 hover:bg-indigo-50'}`}>
                                                        <input 
                                                            type="checkbox" 
                                                            className="hidden"
                                                            checked={isPlantChecked}
                                                            onChange={(e) => {
                                                                let currentP = Array.isArray(simForm.consumingPlants) ? [...simForm.consumingPlants] : [];
                                                                if (e.target.checked) currentP.push(planta.code);
                                                                else currentP = currentP.filter(p => p !== planta.code);
                                                                setSimForm({...simForm, consumingPlants: currentP});
                                                            }}
                                                        />
                                                        {isPlantChecked ? '✓' : ''} {planta.code}
                                                    </label>
                                                );
                                            })}
                                            {nodes.filter(n => n.nodeType === 'Planta' && n.code !== selectedNode).length === 0 && (
                                                <span className="text-[7px] text-red-500 italic">No hay bodegas tipo 'Planta' creados en el Maestro.</span>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                            <div><label className="block text-[9px] font-medium text-gray-600 mb-0.5">LT (Días)</label><input type="number" min="1" value={simForm.lt} onChange={e=>setSimForm({...simForm, lt: e.target.value})} onBlur={e=>engine.forceIntPos(e, 'lt')} className="w-full border p-1 rounded text-[10px]" /></div>
                            <div><label className="block text-[9px] font-medium text-gray-600 mb-0.5">Frecuencia</label><input type="number" min="1" value={simForm.orderCycle} onChange={e=>setSimForm({...simForm, orderCycle: e.target.value})} onBlur={e=>engine.forceIntPos(e, 'orderCycle')} className="w-full border p-1 rounded text-[10px]" /></div>
                            <div className="col-span-2"><input type="text" placeholder="Proveedor..." disabled={simForm.supplyType === 'Distribuido'} value={simForm.supplier} onChange={e=>setSimForm({...simForm, supplier: e.target.value})} className="w-full border p-1 rounded text-[10px] disabled:bg-gray-100" /></div>
                            <div><label className="block text-[9px] font-medium text-gray-600 mb-0.5">MOQ</label><input type="number" min="1" step="any" value={simForm.moq} onChange={e=>setSimForm({...simForm, moq: e.target.value})} onBlur={e=>engine.forceFloatPos(e, 'moq')} className="w-full border p-1 rounded text-[10px]" /></div>
                            <div><label className="block text-[9px] font-medium text-gray-600 mb-0.5">Empaque</label><input type="number" min="1" step="any" value={simForm.packQty} onChange={e=>setSimForm({...simForm, packQty: e.target.value})} onBlur={e=>engine.forceFloatPos(e, 'packQty')} className="w-full border p-1 rounded text-[10px]" /></div>
                            <div><label className="block text-[9px] font-medium text-gray-600 mb-0.5">Tipo Frecuencia</label><select value={simForm.freqType} onChange={e=>setSimForm({...simForm, freqType: e.target.value})} className="w-full border p-1 rounded text-[10px] bg-white"><option value="Estricto">Estricto</option><option value="Irrestricto">Irrestricto</option></select></div>
                            <div className="flex items-end pb-0.5"><div className="flex justify-between items-center w-full px-1"><label className="flex items-center gap-1.5 text-[10px] font-medium text-gray-700 cursor-pointer hover:text-blue-600 transition-colors"><input type="checkbox" checked={simForm.useMot === 'Si'} onChange={e => setSimForm({...simForm, useMot: e.target.checked ? 'Si' : 'No'})} className="cursor-pointer w-3.5 h-3.5" /> Activar MOT</label><span title="Minimum Order Threshold = Max(Tope Amarilla, Zona Roja + Frec*ADU)." className="text-blue-500 cursor-help text-[11px]">ⓘ</span></div></div>
                        </div>
                        <div className="grid grid-cols-2 gap-1 mb-1.5 flex-shrink-0">
                            <div><div className="flex justify-between items-end"><label className="text-[9px] font-medium text-gray-600">Días Pedido</label><button onClick={()=>engine.toggleAllDays('orderDays')} className="text-[7px] text-blue-600 hover:underline font-medium">[Todos]</button></div><div className="grid grid-cols-4 gap-0.5 mt-0.5">{DAYS_OF_WEEK.map(d=><button key={`ped-${d.id}`} onClick={()=>engine.toggleDay('orderDays', d.id)} className={`py-0.5 border rounded text-[7px] font-medium ${Array.isArray(simForm.orderDays) && simForm.orderDays.includes(d.id)?'bg-orange-500 text-white':'bg-white text-gray-400'}`}>{d.l}</button>)}</div></div>
                            <div><div className="flex justify-between items-end"><label className="text-[9px] font-medium text-gray-600">Días Recibo</label><button onClick={()=>engine.toggleAllDays('receiptDays')} className="text-[7px] text-blue-600 hover:underline font-medium">[Todos]</button></div><div className="grid grid-cols-4 gap-0.5 mt-0.5">{DAYS_OF_WEEK.map(d=><button key={`rec-${d.id}`} onClick={()=>engine.toggleDay('receiptDays', d.id)} className={`py-0.5 border rounded text-[7px] font-medium ${Array.isArray(simForm.receiptDays) && simForm.receiptDays.includes(d.id)?'bg-green-500 text-white':'bg-white text-gray-400'}`}>{d.l}</button>)}</div></div>
                        </div>

                        <h3 className="font-bold text-orange-900 text-[11px] mb-1 border-b border-orange-200 pb-0.5 mt-1 flex-shrink-0">Método y Cálculo ADU</h3>
                        <div className="mb-1.5 flex-shrink-0">
    <label className="block text-[9px] font-medium text-gray-600 mb-0.5">Método de Cálculo</label>
    <select value={simForm.bufferMethod} onChange={e => { const val = e.target.value; setSimForm({ ...simForm, bufferMethod: val, minCoverage: val === 'MinMax Dinámico' ? '' : simForm.minCoverage, minMaxFactor: val === 'DDMRP con zona roja en días de cobertura' ? '' : simForm.minMaxFactor }); }} className="w-full border p-1 rounded text-[10px] bg-white font-medium text-indigo-800">
        <option value="DDMRP con zona roja en días de cobertura">DDMRP con zona roja en días de cobertura</option>
        <option value="MinMax Dinámico">MinMax Dinámico</option>
    </select>
</div>
                        {simForm.bufferMethod === 'MinMax Dinámico' && (
                            <div className="mb-1.5 flex-shrink-0 bg-indigo-50 border border-indigo-200 p-1.5 rounded relative overflow-hidden">
                                {engine.isOptimizing && ( <div className="absolute inset-0 bg-indigo-50/80 backdrop-blur-sm z-10 flex items-center justify-center"><span className="text-xs font-bold text-indigo-700 animate-pulse">⏳ Optimizando...</span></div> )}
                                <div className="flex justify-between items-center mb-0.5"><label className="text-[9px] font-bold text-indigo-900">Fact. Protección MinMax (%)</label></div>
                                <div className="flex gap-1"><input type="number" min="0" placeholder="Ej. 15" value={simForm.minMaxFactor} onChange={e=>setSimForm({...simForm, minMaxFactor: e.target.value})} onBlur={e=>engine.forceFloatNonNegative(e, 'minMaxFactor')} className="w-full border p-1 rounded text-[10px] bg-white font-medium" /><button onClick={engine.handleOptimizeMinMaxFactor} className="bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-0.5 rounded shadow-sm text-[10px] font-medium transition flex items-center justify-center whitespace-nowrap border border-indigo-700">✨ Opt.</button></div>
                            </div>
                        )}

                        <div className="mb-1.5 flex-shrink-0"><label className="block text-[9px] font-medium text-gray-600 mb-0.5">Tipo ADU</label><select value={simForm.aduType} onChange={engine.handleAduTypeChange} className="w-full border p-1 rounded text-[10px] bg-white font-medium text-orange-800"><option value="Histórico">Histórico</option><option value="Futuro">Futuro</option><option value="Mixto">Mixto</option></select></div>
                        
                        {/* Proyección Intrasemanal */}
                        {(simForm.aduType === 'Futuro' || simForm.aduType === 'Mixto') && (
                            <div className="col-span-2 mb-1.5 border-l-2 border-blue-400 bg-blue-50/50 p-1.5 rounded-r">
                                <label className="flex items-center gap-1.5 text-[9px] font-medium text-gray-700 cursor-pointer hover:text-blue-600 transition-colors">
                                    <input type="checkbox" checked={simForm.intraWeekProjection === 'Si'} onChange={e => setSimForm({...simForm, intraWeekProjection: e.target.checked ? 'Si' : 'No'})} className="cursor-pointer w-3.5 h-3.5" /> 
                                    Proyectar Forecast Intrasemanal
                                </label>
                                {simForm.intraWeekProjection === 'Si' && (
                                    <div className="flex items-center justify-between gap-2 mt-1 bg-white p-1 border border-blue-200 rounded shadow-sm">
                                        <span className="text-[9px] text-gray-600 font-medium">Horizonte (Días atrás):</span>
                                        <input type="number" min="7" placeholder="Ej. 28" value={simForm.intraWeekHorizon} onChange={e=>setSimForm({...simForm, intraWeekHorizon: e.target.value})} onBlur={e=>engine.forceIntPos(e, 'intraWeekHorizon')} className="w-12 border p-0.5 rounded text-[10px] text-center text-blue-800 font-bold" />
                                    </div>
                                )}
                            </div>
                        )}
                        
                        {simForm.bufferMethod === 'DDMRP Estándar' && (
                            <div className="mb-1.5 flex-shrink-0 bg-orange-50 border border-orange-200 p-1.5 rounded relative overflow-hidden">
                                {engine.isOptimizing && ( <div className="absolute inset-0 bg-orange-50/80 backdrop-blur-sm z-10 flex items-center justify-center"><span className="text-xs font-bold text-orange-700 animate-pulse">⏳ Optimizando...</span></div> )}
                                <div className="flex justify-between items-center mb-0.5"><label className="text-[9px] font-bold text-orange-900">Cobertura Mínima (Días)</label></div>
                                <div className="flex gap-1"><input type="number" min="1" placeholder={`Auto: ${engine.defaultMinCoverage}`} value={simForm.minCoverage} onChange={e => setSimForm({...simForm, minCoverage: e.target.value})} onBlur={e => engine.forceIntPos(e, 'minCoverage')} className="w-full border p-1 rounded text-[10px] placeholder-gray-400 italic font-medium" /><button onClick={engine.handleOptimizeMinCoverage} className="bg-orange-600 hover:bg-orange-700 text-white px-2 py-0.5 rounded shadow-sm text-[10px] font-medium transition flex items-center justify-center whitespace-nowrap border border-orange-700">✨ Opt.</button></div>
                            </div>
                        )}

                        <div className="grid grid-cols-2 gap-1 mb-1.5 flex-shrink-0">
                            <div><div className="flex justify-between"><label className={`text-[9px] font-medium ${simForm.aduType==='Futuro'?'text-gray-300':'text-gray-600'}`}>Días Hist.</label></div><input disabled={simForm.aduType==='Futuro'} type="number" min="1" placeholder={simForm.aduType==='Futuro' ? 'N/A' : `Auto: ${engine.defaultHistoryDays}`} value={simForm.historyDays} onChange={e=>setSimForm({...simForm, historyDays: e.target.value})} onBlur={e=>engine.forceIntPos(e, 'historyDays')} className="w-full border p-1 rounded text-[10px] placeholder-gray-400 italic disabled:bg-gray-100 disabled:text-transparent" /></div>
                            <div><div className="flex justify-between"><label className={`text-[9px] font-medium ${simForm.aduType==='Histórico'?'text-gray-300':'text-gray-600'}`}>Días Fut.</label></div><input disabled={simForm.aduType==='Histórico'} type="number" min="1" placeholder={simForm.aduType==='Histórico' ? 'N/A' : `Auto: ${engine.defaultFutureDays}`} value={simForm.futureDays} onChange={e=>setSimForm({...simForm, futureDays: e.target.value})} onBlur={e=>engine.forceIntPos(e, 'futureDays')} className="w-full border p-1 rounded text-[10px] placeholder-gray-400 italic disabled:bg-gray-100 disabled:text-transparent" /></div>
                        </div>
                        {simForm.bufferMethod === 'DDMRP Estándar' && (
                            <div className="grid grid-cols-2 gap-1 mb-1.5 border-b border-orange-200 pb-1.5 flex-shrink-0">
                                <div><label className="block text-[8px] font-medium text-gray-400">FLT (1/LT)</label><input disabled type="text" value={engine.fltValForm > 0 ? (engine.fltValForm*100).toFixed(1)+'%' : '0%'} className="w-full border p-1 rounded text-[10px] bg-gray-100 text-gray-500 font-mono text-right" /></div>
                                <div><label className="block text-[8px] font-medium text-gray-400">FVAR (CobMín-1)</label><input disabled type="text" value={engine.fvarValForm > 0 ? (engine.fvarValForm*100).toFixed(1)+'%' : '0%'} className="w-full border p-1 rounded text-[10px] bg-gray-100 text-gray-500 font-mono text-right" /></div>
                            </div>
                        )}

                        <h3 className="font-bold text-orange-900 text-[11px] mb-1 flex-shrink-0 mt-1">Filtros de Hist. (Picos y Quiebres)</h3>
                        <div className="grid grid-cols-2 gap-1 mb-1.5 flex-shrink-0">
                            <div><div className="flex justify-between"><label className="text-[9px] font-medium text-gray-600">Umbral (σ)</label></div><input type="number" min="1" placeholder="Ej. 3" value={simForm.peakThreshold} onChange={e=>setSimForm({...simForm, peakThreshold: e.target.value})} onBlur={e=>engine.forceFloatPos(e, 'peakThreshold')} className="w-full border p-1 rounded text-[10px]" /></div>
                            <div><div className="flex justify-between"><label className="text-[9px] font-medium text-gray-600">Días Mín. Cons.</label></div><input type="number" min="1" placeholder="Ej. 5" value={simForm.minConsDaysForPeak} onChange={e=>setSimForm({...simForm, minConsDaysForPeak: e.target.value})} onBlur={e=>engine.forceIntPos(e, 'minConsDaysForPeak')} className="w-full border p-1 rounded text-[10px]" /></div>
                            <div className="col-span-2 flex flex-col gap-1 mt-1 pb-1">
                                <label className="flex items-center gap-1.5 text-[9px] font-medium text-gray-700 cursor-pointer hover:text-blue-600 transition-colors"><input type="checkbox" checked={simForm.discardPeaks === 'Si'} onChange={e => setSimForm({...simForm, discardPeaks: e.target.checked ? 'Si' : 'No'})} className="cursor-pointer w-3.5 h-3.5" /> Descartar Picos del ADU</label>
                                <label className="flex items-center gap-1.5 text-[9px] font-medium text-gray-700 cursor-pointer hover:text-blue-600 transition-colors"><input type="checkbox" checked={simForm.peaksUseOnlyActiveCons === 'Si'} onChange={e => setSimForm({...simForm, peaksUseOnlyActiveCons: e.target.checked ? 'Si' : 'No'})} className="cursor-pointer w-3.5 h-3.5" /> Ignorar ceros al evaluar picos</label>
                            </div>
                            <div className="col-span-2 flex justify-between items-center bg-white p-1 border rounded shadow-sm">
                                <label className="flex items-center gap-1.5 text-[9px] font-medium text-red-700 cursor-pointer"><input type="checkbox" checked={simForm.discardStockouts === 'Si'} onChange={e => setSimForm({...simForm, discardStockouts: e.target.checked ? 'Si' : 'No'})} className="cursor-pointer w-3.5 h-3.5" /> Omitir Quiebres</label>
                                <div className="flex items-center gap-1"><span className="text-[8px] text-gray-500 font-medium">Umbral (%ZR):</span><input disabled={simForm.discardStockouts === 'No'} type="number" min="0" max="100" value={simForm.stockoutThreshold} onChange={e=>setSimForm({...simForm, stockoutThreshold: e.target.value})} onBlur={e=>engine.forceIntNonNegative(e, 'stockoutThreshold')} className="w-10 border p-0.5 rounded text-[9px] text-center disabled:bg-gray-100 font-medium text-red-700" /></div>
                            </div>
                            
                            {/* Control de Vida Útil */}
                            <div className="col-span-2 flex justify-between items-center bg-red-50 p-1 border border-red-200 rounded shadow-sm mt-1">
                                <label className="flex items-center gap-1.5 text-[9px] font-medium text-red-800 cursor-pointer">
                                    <input type="checkbox" checked={simForm.useVidaUtil === 'Si'} onChange={e => {
                                        const checked = e.target.checked;
                                        let defaultVu = '';
                                        if (checked) {
                                            let llt = parseFloat(simForm.lt) || 0, lfreq = parseFloat(simForm.orderCycle) || 0;
                                            defaultVu = Math.max(2, Math.round(2 * (llt + lfreq)));
                                        }
                                        setSimForm({...simForm, useVidaUtil: checked ? 'Si' : 'No', vidaUtilDays: checked && !simForm.vidaUtilDays ? defaultVu : simForm.vidaUtilDays});
                                    }} className="cursor-pointer w-3.5 h-3.5 accent-red-600" /> 
                                    Activar Vida Útil (Perecederos)
                                </label>
                                <div className="flex items-center gap-1">
                                    <span className="text-[8px] text-red-600 font-medium">Días:</span>
                                    <input disabled={simForm.useVidaUtil !== 'Si'} type="number" min="2" value={simForm.vidaUtilDays} onChange={e=>setSimForm({...simForm, vidaUtilDays: e.target.value})} onBlur={e=>engine.forceIntPos(e, 'vidaUtilDays')} className="w-10 border p-0.5 rounded text-[9px] text-center disabled:bg-gray-100 font-bold text-red-800 border-red-300" />
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col mb-2 border-t border-orange-200 pt-2 flex-shrink-0">
                            <h3 className="font-bold text-orange-900 text-[11px] mb-1">Eventos y Ajustes</h3>
                            <button onClick={() => engine.setIsEventsModalOpen(true)} className="w-full py-1 text-white bg-indigo-500 hover:bg-indigo-600 font-medium rounded text-[10px] shadow-sm transition flex items-center justify-center gap-1"><span>📅</span> Gestionar Plan ({simForm.events?.length || 0} Ev / {simForm.adjustments?.length || 0} Aj)</button>
                        </div>

                        <h3 className="font-bold text-orange-900 text-[11px] mb-1 border-b border-orange-200 pb-0.5 mt-1 flex-shrink-0">Demanda Calificada</h3>
                        <div className="grid grid-cols-3 gap-1 mb-2 flex-shrink-0">
                            <div><div className="flex justify-between"><label className="text-[9px] font-medium text-gray-600">HDC</label></div><input type="number" min="0" placeholder={`Auto: ${engine.defaultHdc}`} value={simForm.hdc} onChange={e=>setSimForm({...simForm, hdc: e.target.value})} onBlur={e=>engine.forceIntNonNegative(e, 'hdc')} className="w-full border p-1 rounded text-[10px] placeholder-gray-400 italic" /></div>
                            <div><div className="flex justify-between"><label className="text-[9px] font-medium text-gray-600">UDC (%)</label></div><input type="number" min="1" placeholder="Auto: 30" value={simForm.udc} onChange={e=>setSimForm({...simForm, udc: e.target.value})} onBlur={e=>engine.forceFloatPos(e, 'udc')} className="w-full border p-1 rounded text-[10px] placeholder-gray-400 italic" /></div>
                            <div><div className="flex justify-between"><label className="text-[9px] font-medium text-gray-600">Vis. Hoy(%)</label></div><input type="number" min="0" max="100" placeholder="Auto: 100" value={simForm.todayVis} onChange={e=>setSimForm({...simForm, todayVis: e.target.value})} onBlur={e=>engine.forceIntNonNegative(e, 'todayVis')} className="w-full border p-1 rounded text-[10px] placeholder-gray-400 italic" /></div>
                        </div>

                        <div className="mt-auto flex flex-col gap-1.5 pt-1 border-t border-orange-200 flex-shrink-0">
                            <button onClick={engine.handleSimulate} className="w-full py-1.5 text-white font-medium rounded shadow-sm bg-green-600 hover:bg-green-700 transition text-[11px]">▶ Ejecutar Simulación</button>
                            
                            <div className="grid grid-cols-2 gap-1 mt-1">
                                {engine.activeViewScenarioId ? <button onClick={engine.handleUpdateScenario} className="w-full py-1 text-blue-700 font-medium rounded text-[10px] shadow-sm border border-blue-300 hover:bg-blue-100">🔄 Actualizar Esc.</button> : <button onClick={engine.handleSaveScenario} className="w-full py-1 text-purple-700 font-medium rounded text-[10px] shadow-sm border border-purple-300 hover:bg-purple-100">➕ Guardar Escenario</button>}
                                <button onClick={() => engine.setIsScenarioModalOpen(true)} className="w-full py-1 text-indigo-700 bg-indigo-50 font-medium rounded text-[10px] shadow-sm border border-indigo-300 hover:bg-indigo-100">📊 Comparativo | {engine.currentScenarios.length} esc.</button>
                            </div>
                            
                            {/* --- BOTONES CONSOLIDADOS --- */}
                            <div className="grid grid-cols-2 gap-1 mt-1">
                                <button 
                                    onClick={engine.handleSave} 
                                    disabled={engine.isSaving}
                                    className="w-full py-1 text-white bg-orange-600 hover:bg-orange-700 font-medium rounded text-[10px] shadow-sm transition disabled:opacity-50"
                                >
                                    💾 Guardar (Local + Nube)
                                </button>
                                <button 
                                    onClick={engine.handlePullLogistics} 
                                    disabled={engine.isSaving}
                                    className="w-full py-1 text-emerald-800 bg-emerald-100 border border-emerald-300 hover:bg-emerald-200 font-medium rounded text-[10px] shadow-sm transition disabled:opacity-50"
                                >
                                    ☁️ Bajar Nube
                                </button>
                            </div>
                            <div className="mt-0.5">
                                <button 
                                    onClick={() => engine.setIsModalOpen(true)} 
                                    className="w-full py-1 text-gray-600 bg-gray-100 font-medium rounded text-[10px] shadow-sm border border-gray-300 hover:bg-gray-200"
                                >
                                    📋 Ver Maestro (Todos los Parámetros)
                                </button>
                            </div>
                            
                            {Array.isArray(logistics) && logistics.some(l => l && l.prodCode === selectedProd && l.nodeCode === selectedNode) && <button onClick={()=>{cascadeDelete('logistics', {prodCode: selectedProd, nodeCode: selectedNode}); engine.setSimParams(null);}} className="w-full py-0.5 text-red-600 font-medium text-[9px] hover:underline mt-1">Eliminar Parámetros</button>}
                        </div>
                    </div>
                </div>
            );
        }

        function SimulatorChartAndGrid({ engine, simParams, showChart, setShowChart }) {
            const chartSimRef = useRef(null);
            const chartInstanceRef = useRef(null); 
            const groupsRef = useRef([]); 
            const legendStateRef = useRef({ 'Demanda Base': true, 'Dem. Extra': true, 'Forecast': true, 'Dem. Calif': false, 'ADU': true, 'Flujo Neto': true, 'Inv. Ini': true, 'Transito': false, 'Z. Verde': true, 'Z. Amarilla': true, 'Z. Roja': true, 'Periodo Reservado': true });
            
            const [selectedRange, setSelectedRange] = useState(null); 
            const [dragStartIdx, setDragStartIdx] = useState(null); 
            const [showGrid, setShowGrid] = useState(true);
            const rowRefs = useRef([]); 

            // --- ESTADOS Y LÓGICA DEL REDIMENSIONADOR (SPLITTER) ---
            const [chartHeight, setChartHeight] = useState(320);
            const [isDraggingDivider, setIsDraggingDivider] = useState(false);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!isDraggingDivider) return;
                    setChartHeight(prev => Math.max(150, Math.min(prev + e.movementY, window.innerHeight - 300)));
                };
                
                const handleMouseUp = () => setIsDraggingDivider(false);

                if (isDraggingDivider) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                    document.body.style.userSelect = 'none'; 
                    document.body.style.cursor = 'row-resize';
                } else {
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                }

                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                };
            }, [isDraggingDivider]);

            useEffect(() => {
                if (chartInstanceRef.current) chartInstanceRef.current.resize();
            }, [chartHeight]);

            const handleToggleChart = () => { if (showChart && !showGrid) setShowGrid(true); setShowChart(!showChart); };
            const handleToggleGrid = () => { if (showGrid && !showChart) setShowChart(true); setShowGrid(!showGrid); };

            useEffect(() => {
                const handleGlobalMouseUp = () => setDragStartIdx(null);
                window.addEventListener('mouseup', handleGlobalMouseUp);
                return () => window.removeEventListener('mouseup', handleGlobalMouseUp);
            }, []);

            const syncChartBrush = (minIdx, maxIdx) => {
                if (chartInstanceRef.current && groupsRef.current.length > 0) {
                    let visualMin = groupsRef.current.findIndex(g => minIdx >= g.firstIndex && minIdx < g.firstIndex + g.count);
                    let visualMax = groupsRef.current.findIndex(g => maxIdx >= g.firstIndex && maxIdx < g.firstIndex + g.count);
                    
                    if (visualMin !== -1 && visualMax !== -1) {
                        chartInstanceRef.current.dispatchAction({
                            type: 'brush',
                            areas: [{ brushType: 'lineX', coordRange: [visualMin - 0.4, visualMax + 0.4], xAxisIndex: 0 }]
                        });
                    }
                }
            };

            useEffect(() => {
                const timer = setTimeout(() => {
                    let myChart = echarts.getInstanceByDom(chartSimRef.current);
                    if (myChart) myChart.resize();
                }, 150);
                return () => clearTimeout(timer);
            }, [showGrid, showChart]);

            useEffect(() => {
                if(!showChart || !engine.historyDataArray || !engine.bufferArrays || !chartSimRef.current) return;
                let myChart = echarts.getInstanceByDom(chartSimRef.current) || echarts.init(chartSimRef.current);
                chartInstanceRef.current = myChart; 
                let labelsAxis0 = [], labelsAxis1 = [], tooltipLabels = [], aggQtyOrig = [], aggQtyExtra = [], aggFore = [], aggDc = [], aggAdu = [], aggNfp = [], aggIni = [], aggTrans = [], aggRoja = [], aggAmarilla = [], aggVerde = [], groups = [], lastMonth = null, lastYear = null;

                engine.historyDataArray.forEach((d, i) => {
                    let dateObj = new Date(d.date), key = '', day = dateObj.getDate().toString().padStart(2, '0'), month = dateObj.getMonth(), year = dateObj.getFullYear();
                    let monthStr = dateObj.toLocaleDateString('es-ES', { month: 'short' }); monthStr = monthStr.charAt(0).toUpperCase() + monthStr.slice(1);
                    if (engine.simTimeView === 'daily') key = d.date;
                    else if (engine.simTimeView === 'weekly') { let { week, year: wYear } = getISOWeekAndYear(dateObj); key = `${wYear}-W${week.toString().padStart(2, '0')}`; } 
                    else key = `${year}-${month.toString().padStart(2, '0')}`;

                    let g = groups.find(g => g.key === key);
                    if (!g) {
                        let lbl0 = '', lbl1 = '';
                        if (engine.simTimeView === 'daily') { lbl0 = day; lbl1 = (month !== lastMonth || i === 0) ? monthStr + ((year !== lastYear || i===0) ? `\n${year}` : '') : ''; lastMonth = month; lastYear = year; } 
                        else if (engine.simTimeView === 'weekly') { let { week, year: wYear } = getISOWeekAndYear(dateObj); lbl0 = `Sem ${week}`; lbl1 = (month !== lastMonth || groups.length === 0) ? monthStr + ((wYear !== lastYear || groups.length === 0) ? `\n${wYear}` : '') : ''; lastMonth = month; lastYear = wYear; } 
                        else { lbl0 = monthStr; lbl1 = (year !== lastYear || groups.length === 0) ? year.toString() : ''; lastYear = year; }
                        
                        g = { key, lbl0, lbl1, count: 0, qtyOrig: 0, qtyExtra: 0, qtyFore: 0, dc: engine.bufferArrays.dc[i], adu: engine.bufferArrays.adu[i], roja: engine.bufferArrays.roja[i], amarilla: engine.bufferArrays.amarilla[i], verde: engine.bufferArrays.verde[i], ini: engine.bufferArrays.invIni[i], trans: engine.bufferArrays.transito[i], nfp: engine.bufferArrays.nfp[i], isPeak: engine.bufferArrays.isPeak[i], firstIndex: i };
                        groups.push(g);
                    }
                    g.qtyOrig += engine.bufferArrays.qtyOriginal[i]; g.qtyExtra += engine.bufferArrays.qtyExtra[i]; g.qtyFore += engine.bufferArrays.forecast[i]; g.count++; g.isPeak = g.isPeak || engine.bufferArrays.isPeak[i];
                });
                
                groupsRef.current = groups; 

                groups.forEach(g => {
                    labelsAxis0.push(g.lbl0); labelsAxis1.push(g.lbl1);
                    let tLabel = '';
                    if (engine.simTimeView === 'daily') tLabel = formatShortDate(g.key); 
                    else if (engine.simTimeView === 'weekly') tLabel = `Semana ${g.key.split('-W')[1]}, ${g.key.split('-')[0]}`; 
                    else { const parts = g.key.split('-'); tLabel = `${MONTHS[parseInt(parts[1], 10)]} ${parts[0]}`; }
                    tooltipLabels.push(tLabel); aggQtyOrig.push(g.qtyOrig); aggQtyExtra.push(g.qtyExtra); aggFore.push(g.qtyFore); aggDc.push(g.dc); aggAdu.push(g.adu); aggRoja.push(g.roja); aggAmarilla.push(g.amarilla); aggVerde.push(g.verde); aggIni.push(g.ini); aggTrans.push(g.trans); aggNfp.push(g.nfp);
                });

                let markAreaData = [];
                let showWarmup = simParams && (simParams.aduType !== 'Futuro' || simParams.intraWeekProjection === 'Si');
                if (showWarmup) {
                    let nP = (simParams.intraWeekProjection === 'Si') ? (parseInt(simParams.intraWeekHorizon) || 28) : (parseInt(simParams.historyDays) || 1);
                    if (nP > 0 && groups.length > 0) {
                        let targetIdx = Math.min(nP - 1, engine.historyDataArray.length - 1);
                        if (targetIdx >= 0) {
                            const targetDateObj = new Date(engine.historyDataArray[targetIdx].date);
                            let targetKey = engine.simTimeView === 'daily' ? engine.historyDataArray[targetIdx].date : (engine.simTimeView === 'weekly' ? `${getISOWeekAndYear(targetDateObj).year}-W${getISOWeekAndYear(targetDateObj).week.toString().padStart(2, '0')}` : `${targetDateObj.getFullYear()}-${targetDateObj.getMonth().toString().padStart(2, '0')}`);
                            let warmUpEndIdx = groups.findIndex(g => g.key === targetKey);
                            if (warmUpEndIdx >= 0) markAreaData.push([{ xAxis: 0, itemStyle: { color: 'rgba(107, 114, 128, 0.2)' } }, { xAxis: warmUpEndIdx }]);
                        }
                    }
                }

                if (simParams && simParams.events && engine.simTimeView === 'daily') {
                    simParams.events.forEach(ev => {
                        let startIdx = groups.findIndex(g => g.key.split('T')[0] >= ev.startDate), endIdx = -1;
                        for(let k = groups.length - 1; k >= 0; k--) if (groups[k].key.split('T')[0] <= ev.endDate) { endIdx = k; break; }
                        if (startIdx >= 0 && endIdx >= 0 && startIdx <= endIdx) markAreaData.push([ { xAxis: startIdx, name: ev.name, label: { show: false }, itemStyle: { color: ev.type === 'DEMAND' ? 'rgba(251, 146, 60, 0.2)' : 'rgba(220, 38, 38, 0.2)' } }, { xAxis: endIdx } ]);
                    });
                }
                let markAreaObj = markAreaData.length > 0 ? { data: markAreaData } : null;
                let peakMarkPoints = [];
                groups.forEach((g, i) => { if (g.isPeak) peakMarkPoints.push({ xAxis: i, y: '25%', symbol: 'circle', symbolSize: 8, itemStyle: { color: '#dc2626', borderColor: '#ffffff', borderWidth: 1.5, shadowBlur: 2, shadowColor: 'rgba(0,0,0,0.3)' }, label: { show: false } }); });

                const option = {
                    animationDurationUpdate: 500, animationEasingUpdate: 'quinticInOut',
                    tooltip: { 
                        confine: true, trigger: 'axis', backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#ea580c', textStyle: { color: '#333' }, 
                        formatter: function (params) {
                            if (!params || !params.length) return '';
                            let title = tooltipLabels[params[0].dataIndex];
                            let res = `<div style="text-align:left; margin-bottom:4px; border-bottom:1px solid #e5e7eb; padding-bottom:2px;"><strong style="color:#1e3a8a; font-size:12px;">${title}</strong></div>`;
                            
                            params.forEach(function (item) { 
                                if (item.seriesName === 'Periodo Reservado') return; 
                                res += `<div style="display:flex; justify-content:space-between; gap:12px; font-size:11px;"><span>${item.marker} ${item.seriesName}</span><span style="font-weight:600; color:#374151;">${Number(item.data).toLocaleString('es-ES', {maximumFractionDigits:1})}</span></div>`; 
                            });

                            if (simParams && engine.simTimeView === 'daily') {
                                const currentDate = engine.historyDataArray[params[0].dataIndex].date.split('T')[0];
                                let dTarget = new Date(currentDate + 'T12:00:00'); dTarget.setDate(dTarget.getDate() + (parseInt(simParams.hdc) || 0));
                                const activeEvents = simParams.events?.filter(e => currentDate >= e.startDate && currentDate <= e.endDate) || [];
                                const activeZAFs = simParams.adjustments?.filter(a => a.type === 'ZAF' && currentDate >= a.startDate && currentDate <= a.endDate) || [];
                                const activeFicts = simParams.adjustments?.filter(a => a.type === 'FICTITIOUS' && currentDate >= a.startDate && currentDate <= a.endDate) || [];
                                
                                if (activeEvents.length > 0 || activeZAFs.length > 0 || activeFicts.length > 0) {
                                    res += `<div style="margin-top: 6px; padding-top: 4px; border-top: 1px dashed #cbd5e1;">`;
                                    activeEvents.forEach(ev => { const isDemand = ev.type === 'DEMAND', icon = isDemand ? '📈' : '🛑', color = isDemand ? '#ea580c' : '#dc2626'; let impactStr = ''; if (isDemand) { if (ev.impactType === 'PERCENTAGE') impactStr = `(+${ev.value}%)`; else { let diffDays = Math.max(1, Math.round((new Date(ev.endDate+'T12:00:00') - new Date(ev.startDate+'T12:00:00')) / 86400000) + 1); impactStr = `(+${(parseFloat(ev.value) / diffDays).toFixed(1)} und/día)`; } } else { impactStr = 'Paro / Congelado'; } res += `<div style="display:flex; justify-content:space-between; gap:12px; font-size:11px; color: ${color}; font-weight: bold; margin-bottom: 2px;"><span>${icon} ${ev.name}</span><span>${impactStr}</span></div>`; });
                                    activeZAFs.forEach(zaf => { const isAbs = zaf.impactType === 'ABSOLUTE'; res += `<div style="display:flex; justify-content:space-between; gap:12px; font-size:11px; color: #4338ca; font-weight: bold; margin-bottom: 2px;"><span>🛠️ ${zaf.name} (ZAF ${zaf.zone})</span><span>+${zaf.value}${isAbs ? ' und' : '%'}</span></div>`; });
                                    activeFicts.forEach(f => { res += `<div style="display:flex; justify-content:space-between; gap:12px; font-size:11px; color: #059669; font-weight: bold; margin-bottom: 2px;"><span>👻 ${f.name} (Ped. Ficticio)</span><span>+${parseFloat(f.value)} en DC</span></div>`; });
                                    res += `</div>`;
                                }
                            }
                            return res;
                        }
                    },
                    brush: {
                        xAxisIndex: 'all',
                        brushLink: 'all',
                        outOfBrush: { colorAlpha: 1 }, 
                        brushStyle: { borderWidth: 1, color: 'rgba(250, 204, 21, 0.4)', borderColor: 'rgba(234, 179, 8, 0.8)' }
                    },
                    toolbox: { 
                        show: true, 
                        feature: { 
                            brush: { type: ['lineX', 'clear'], title: { lineX: 'Seleccionar Rango', clear: 'Limpiar Selección' } },
                            dataZoom: { yAxisIndex: 'none', title: { zoom: 'Zoom', back: 'Atrás' } }, 
                            restore: { title: 'Restaurar' } 
                        }, 
                        right: 15, top: 0 
                    },
                    legend: { show: true, data: ['Demanda Base', 'Dem. Extra', 'Forecast', 'Dem. Calif', 'ADU', 'Flujo Neto', 'Inv. Ini', 'Transito', 'Z. Verde', 'Z. Amarilla', 'Z. Roja', 'Periodo Reservado'], top: 0, itemGap: 8, itemWidth: 15, textStyle: {fontSize: 9, fontWeight: 'medium'}, selected: legendStateRef.current },
                    
                    // CORRECCIÓN MAGISTRAL: Eliminamos el top: '25%' y lo cambiamos por valores en Píxeles (top: 55, bottom: 50)
                    grid: { left: '2%', right: '3%', bottom: 50, top: 55, containLabel: true, show: true, backgroundColor: '#93c5fd', borderColor: '#60a5fa' },
                    
                    xAxis: [
                        { type: 'category', data: labelsAxis0, axisLabel: { interval: 'auto', hideOverlap: true, color: '#4b5563', fontSize: 10, fontWeight: 'medium' }, axisTick: { alignWithLabel: true }, axisLine: { show: true, lineStyle: { color: '#6b7280' } } },
                        { type: 'category', data: labelsAxis1, position: 'bottom', offset: 14, axisLabel: { interval: 0, align: 'center', lineHeight: 12, color: '#374151', fontSize: 10, fontWeight:'medium' }, axisTick: { show: false }, axisLine: { show: false } }
                    ],
                    yAxis: { type: 'value', min: function (value) { return value.min < 0 ? value.min : 0; }, splitLine: { lineStyle: { color: '#60a5fa', type: 'dashed' } } },
                    dataZoom: [
                        { type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 },
                        { type: 'slider', xAxisIndex: [0, 1], height: 20, bottom: 5, start: 0, end: 100, borderColor: 'transparent', backgroundColor: '#e2e8f0', fillerColor: 'rgba(59, 130, 246, 0.2)' }
                    ],
                    series: [
                        { name: 'Z. Roja', type: 'line', stack: 'Buffer', areaStyle: { opacity: 0.8 }, lineStyle: { width: 0 }, symbol: 'none', data: aggRoja, itemStyle: { color: '#fca5a5' }, z: 1 },
                        { name: 'Z. Amarilla', type: 'line', stack: 'Buffer', areaStyle: { opacity: 0.8 }, lineStyle: { width: 0 }, symbol: 'none', data: aggAmarilla, itemStyle: { color: '#fde047' }, z: 1 },
                        { name: 'Z. Verde', type: 'line', stack: 'Buffer', areaStyle: { opacity: 0.8 }, lineStyle: { width: 0 }, symbol: 'none', data: aggVerde, itemStyle: { color: '#86efac' }, z: 1 },
                        { name: 'Demanda Base', type: 'bar', stack: 'DemandaStack', data: aggQtyOrig, itemStyle: { color: '#ea580c' }, barMaxWidth: 20, z: 10 },
                        { name: 'Dem. Extra', type: 'bar', stack: 'DemandaStack', data: aggQtyExtra, itemStyle: { color: '#7c3aed' }, barMaxWidth: 20, z: 10, markPoint: { data: peakMarkPoints, z: 30 } },
                        { name: 'Forecast', type: 'line', data: aggFore, itemStyle: { color: '#3b82f6' }, lineStyle: { width: 2, type: 'dashed' }, symbol: 'circle', symbolSize: 4, z: 11 },
                        { name: 'Dem. Calif', type: 'line', data: aggDc, itemStyle: { color: '#991b1b' }, symbol: 'none', lineStyle: { width: 1.5 }, z: 10 },
                        { name: 'ADU', type: 'line', data: aggAdu, itemStyle: { color: '#dc2626' }, symbol: 'none', lineStyle: { width: 2 }, z: 10 },
                        { name: 'Inv. Ini', type: 'line', data: aggIni, itemStyle: { color: '#4b5563' }, symbol: 'none', lineStyle: { width: 1 }, z: 11 },
                        { name: 'Transito', type: 'line', data: aggTrans, itemStyle: { color: '#00ff7f' }, symbol: 'none', lineStyle: { width: 1.5, type:'solid' }, z: 11 },
                        { name: 'Flujo Neto', type: 'line', data: aggNfp, itemStyle: { color: 'aqua' }, symbol: 'none', lineStyle: { width: 1 }, z: 12, markArea: { silent: true, itemStyle: { color: 'rgba(17, 24, 39, 0.8)' }, data: [ [ { yAxis: 0 }, { yAxis: -99999999 } ] ] } },
                        { name: 'Periodo Reservado', type: 'bar', data: [], markArea: markAreaObj, itemStyle: { color: 'rgba(107, 114, 128, 0.5)' }, z: 50 }
                    ]
                };

                myChart.setOption(option, false); 
                
                myChart.dispatchAction({
                    type: 'takeGlobalCursor', key: 'brush', brushOption: { brushType: 'lineX', brushMode: 'single' }
                });

                myChart.on('legendselectchanged', function(params) { legendStateRef.current = params.selected; });

                myChart.off('brushEnd');
                myChart.on('brushEnd', function (params) {
                    if (!params.areas || params.areas.length === 0) return;
                    let range = params.areas[0].coordRange;
                    let sG = Math.max(0, Math.ceil(range[0]));
                    let eG = Math.min(groups.length - 1, Math.floor(range[1]));
                    
                    if (groups[sG] && groups[eG]) {
                        let startIdx = groups[sG].firstIndex;
                        let endIdx = groups[eG].firstIndex + groups[eG].count - 1;
                        setSelectedRange([startIdx, endIdx]);
                        
                        if (rowRefs.current[startIdx]) {
                            rowRefs.current[startIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                });

                myChart.getZr().off('click');
                myChart.getZr().on('click', function (params) {
                    const pointInPixel = [params.offsetX, params.offsetY];
                    if (myChart.containPixel('grid', pointInPixel)) {
                        const xIndex = Math.round(myChart.convertFromPixel({seriesIndex: 0}, pointInPixel)[0]);
                        if (groups[xIndex]) {
                            let realIdx = groups[xIndex].firstIndex;
                            setSelectedRange([realIdx, realIdx]);
                            
                            if (rowRefs.current[realIdx]) {
                                rowRefs.current[realIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                            
                            myChart.dispatchAction({
                                type: 'brush',
                                areas: [{ brushType: 'lineX', coordRange: [xIndex - 0.4, xIndex + 0.4], xAxisIndex: 0 }]
                            });
                        }
                    }
                });

                const resize = () => { if (myChart) myChart.resize(); }; window.addEventListener('resize', resize);
                return () => { window.removeEventListener('resize', resize); myChart.dispose(); };
            }, [showChart, engine.historyDataArray, engine.bufferArrays, engine.simTimeView, simParams]);

            return (
                <div className={`transition-all duration-500 ease-in-out flex flex-col h-full gap-2 overflow-hidden relative ${engine.showParamsPanel ? 'w-full md:w-3/4' : 'w-full'}`}>
                    <div className="flex justify-between items-center bg-white border border-gray-200 p-1 rounded-lg shadow-sm flex-shrink-0 z-20">
                        <button onClick={engine.handleToggleParams} className="bg-orange-50 text-orange-800 hover:bg-orange-100 font-medium text-[10px] px-2 py-1 rounded transition border border-orange-200 shadow-sm">{engine.showParamsPanel ? '◀ Ocultar Parámetros' : '▶ Configurar Parámetros'}</button>
                        {simParams && (
                            <div className="flex items-center space-x-1 bg-gray-50 px-2 py-0.5 rounded border border-gray-200 shadow-inner">
                                <span className="text-[9px] font-bold text-gray-500 mr-1 uppercase tracking-wide">Vista:</span>
                                <div className={`px-2 py-1 text-[10px] font-medium rounded ${!engine.activeViewScenarioId ? 'bg-green-600 text-white shadow-sm' : 'text-gray-500'}`}>Simulación Actual</div>
                                {engine.currentScenarios.length > 0 && <span className="text-gray-300 mx-1">|</span>}
                                {engine.currentScenarios.map((sc, idx) => {
                                    const isWinner = engine.scenarioEvaluation?.bestIds?.includes(sc.id);
                                    return <button key={sc.id} onClick={() => engine.handleViewScenario(sc)} className={`px-3 py-1 text-[10px] font-medium rounded transition border flex items-center gap-1 ${engine.activeViewScenarioId === sc.id ? 'bg-indigo-600 text-white border-indigo-700 shadow-sm' : 'bg-white text-gray-600 border-gray-300 hover:bg-indigo-50 hover:text-indigo-700'}`}>{isWinner && <span>🏆</span>}<span>Esc. {idx + 1}</span></button>
                                })}
                            </div>
                        )}
                        <div className="flex space-x-1">
                            <button onClick={()=>engine.setSimTimeView('daily')} className={`px-2 py-0.5 text-[10px] font-medium rounded ${engine.simTimeView==='daily'?'bg-blue-600 text-white shadow-sm':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>Diario</button>
                            <button onClick={()=>engine.setSimTimeView('weekly')} className={`px-2 py-0.5 text-[10px] font-medium rounded ${engine.simTimeView==='weekly'?'bg-blue-600 text-white shadow-sm':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>Semanal</button>
                            <button onClick={()=>engine.setSimTimeView('monthly')} className={`px-2 py-0.5 text-[10px] font-medium rounded ${engine.simTimeView==='monthly'?'bg-blue-600 text-white shadow-sm':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>Mensual</button>
                        </div>
                    </div>

                    {!simParams ? (

                                                                <button onClick={() => { let suggStart = ev.startDate, suggEnd = ev.endDate; if (suggestionType === 'FICTITIOUS' || (suggestionType === 'ZAF' && ev.type === 'SUPPLY')) { let dStart = new Date(ev.startDate + 'T12:00:00'); dStart.setDate(dStart.getDate() - Math.round(lt_frec)); suggStart = dStart.toISOString().split('T')[0]; let dEnd = new Date(ev.startDate + 'T12:00:00'); dEnd.setDate(dEnd.getDate() - 1); suggEnd = dEnd.toISOString().split('T')[0]; } let suggestedValue = ''; if (suggestionType === 'FICTITIOUS' && ev.impactType === 'ABSOLUTE') suggestedValue = ev.value; else if (ev.type === 'SUPPLY') suggestedValue = supplyZafPercent; engine.setNewAdjustment({ id: '', name: `Mitigar: ${ev.name}`, type: suggestionType, zone: ev.type === 'SUPPLY' ? 'AMARILLA' : 'ALL', startDate: suggStart, endDate: suggEnd, impactType: suggestionType === 'FICTITIOUS' ? 'ABSOLUTE' : 'PERCENTAGE', value: suggestedValue }); engine.setEventsModalTab('ADJUSTMENTS'); }} className="text-blue-700 bg-white border border-blue-200 px-2 py-0.5 rounded shadow-sm hover:bg-blue-100 font-bold transition">Aplicar sugerencia ➔</button>

                                    </div>
                                    {engine.showAdjustmentsHelp && (

                                            <div className="col-span-2"><label className="block text-[10px] font-bold text-gray-700 mb-0.5">Tipo de Herramienta</label><select value={engine.newAdjustment.type} onChange={e=>engine.setNewAdjustment({...engine.newAdjustment, type: e.target.value, impactType: e.target.value==='FICTITIOUS'?'ABSOLUTE':'PERCENTAGE'})} className="w-full border p-1.5 rounded text-xs font-medium bg-white"><option value="FICTITIOUS">👻 Pedido Ficticio (Inyectar DC)</option><option value="ZAF">🛠 ZAF (Ajuste de Zona)</option></select></div>

                                            {engine.newAdjustment.type === 'ZAF' ? ( <><div className="col-span-1"><label className="block text-[10px] font-bold text-gray-700 mb-0.5">Zona a Afectar</label><select value={engine.newAdjustment.zone} onChange={e=>engine.setNewAdjustment({...engine.newAdjustment, zone: e.target.value})} className="w-full border p-1.5 rounded text-xs bg-white font-medium"><option value="ALL">Todas</option><option value="ROJA" className="text-red-700">Roja</option><option value="AMARILLA" className="text-yellow-700">Amarilla</option><option value="VERDE" className="text-green-700">Verde</option></select></div><div className="flex gap-1"><div className="w-1/2"><label className="block text-[10px] font-bold text-gray-700 mb-0.5">Tipo</label><select value={engine.newAdjustment.impactType} onChange={e=>engine.setNewAdjustment({...engine.newAdjustment, impactType: e.target.value})} className="w-full border p-1.5 rounded text-[10px] bg-white"><option value="PERCENTAGE">%</option><option value="ABSOLUTE">Cant</option></select></div><div className="w-1/2"><label className="block text-[10px] font-bold text-gray-700 mb-0.5">Valor (+)</label><input type="number" min="0" placeholder="20" value={engine.newAdjustment.value} onChange={e=>engine.setNewAdjustment({...engine.newAdjustment, value: e.target.value})} className="w-full border p-1.5 rounded text-xs font-bold text-indigo-600 bg-white" /></div></div></> ) : ( <div className="col-span-2"><label className="block text-[10px] font-bold text-gray-700 mb-0.5">Cantidad Absoluta del Pedido Ficticio</label><input type="number" min="0" placeholder="Ej. 1000" value={engine.newAdjustment.value} onChange={e=>engine.setNewAdjustment({...engine.newAdjustment, value: e.target.value})} className="w-full border p-1.5 rounded text-xs font-bold text-emerald-600 bg-white" /><p className="text-[9px] text-gray-500 mt-0.5 leading-tight">Se inyectará <b>completamente (sin dividir)</b> a la DC.</p></div> )}

                                            {engine.newAdjustment.id && ( <button onClick={() => engine.setNewAdjustment({ id: '', name: '', type: 'FICTITIOUS', zone: 'ALL', startDate: '', endDate: '', impactType: 'ABSOLUTE', value: '' })} className="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-1.5 px-4 rounded text-[11px] transition shadow">Cancelar</button> )}

                                            <div className="flex flex-col gap-2">
                                                {simForm.adjustments.map(adj => {
                                                    return (
                                                        <div key={adj.id} className={`flex justify-between items-center p-2 rounded border transition shadow-sm ${engine.newAdjustment.id === adj.id ? 'bg-indigo-100 border-indigo-300' : 'bg-white hover:bg-gray-50 border-gray-200'}`}>

                                                                <div className="flex items-center border-l border-gray-300 pl-3 ml-1 gap-2"><button onClick={() => engine.setNewAdjustment(adj)} className="text-blue-500 hover:text-blue-700 text-sm transition" title="Editar Ajuste">✏️</button><button onClick={() => { if(confirm(`¿Eliminar el ajuste "${adj.name}"?`)) { setSimForm(prev => ({ ...prev, adjustments: prev.adjustments.filter(a => a.id !== adj.id) })); if (engine.newAdjustment.id === adj.id) engine.setNewAdjustment({ id: '', name: '', type: 'FICTITIOUS', zone: 'ALL', startDate: '', endDate: '', impactType: 'ABSOLUTE', value: '' }); } }} className="text-red-400 hover:text-red-600 text-xl leading-none transition" title="Eliminar">&times;</button></div>

        function SimulatorScenariosModal({ engine, selectedProd, selectedNode, products, nodes }) {
            const paramLabels = { supplyType: 'Tipo Abast.', originNode: 'Origen', supplier: 'Proveedor', lt: 'Lead Time (d)', orderCycle: 'Frecuencia (d)', moq: 'MOQ', packQty: 'Empaque', freqType: 'Tipo Frec.', useMot: 'Usar MOT', bufferMethod: 'Método Buffer', minMaxFactor: 'Fact. MinMax (%)', peakThreshold: 'Umbral Picos (σ)', minConsDaysForPeak: 'Días Mín. Picos', discardPeaks: 'Descartar Picos', peaksUseOnlyActiveCons: 'Ignorar Ceros en Picos', discardStockouts: 'Omitir Quiebres', stockoutThreshold: 'Umbral Quiebre (%ZR)', aduType: 'Tipo ADU', historyDays: 'Días Hist.', futureDays: 'Días Fut.', minCoverage: 'Cob. Mín (d)', hdc: 'HDC (d)', udc: 'UDC (%)', todayVis: 'Vis. Hoy (%)', orderDays: 'Días Pedido', receiptDays: 'Días Recibo' };
            const getParamDisplayValue = (val) => Array.isArray(val) ? val.join(', ') : (val === '' || val === undefined ? '-' : String(val));
            let differingParams = [], commonParams = [];
            if (engine.currentScenarios.length > 0) { Object.keys(paramLabels).forEach(key => { const uniqueValues = new Set(engine.currentScenarios.map(sc => getParamDisplayValue(sc.params[key]))); if (uniqueValues.size > 1) differingParams.push(key); else commonParams.push(key); }); }
            const prodDesc = Array.isArray(products) ? products.find(p => p.code === selectedProd)?.desc || '' : '', nodeName = Array.isArray(nodes) ? nodes.find(n => n.code === selectedNode)?.name || '' : '';
            
            const { bestIds, scores } = engine.scenarioEvaluation;

            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-2 md:p-4">
                    <div className="bg-white rounded-lg shadow-2xl w-full max-w-5xl flex flex-col max-h-[95vh] overflow-hidden">
                        <div className="p-3 border-b flex justify-between items-center bg-gray-50 flex-shrink-0">
                            <h2 className="font-bold text-sm text-indigo-800">📊 Comparativa Financiera ({selectedProd} {prodDesc && `- ${prodDesc}`} | {selectedNode} {nodeName && `- ${nodeName}`})</h2>
                            <button onClick={() => engine.setIsScenarioModalOpen(false)} className="text-gray-400 hover:text-red-500 font-medium text-xl transition">&times;</button>
                        </div>
                        <div className="bg-green-50 border-b border-green-200 px-4 py-2 flex-shrink-0 text-green-800 text-[10px] flex items-start gap-2">
                            <span className="text-lg leading-none">💡</span>
                            <div><strong>Lógica Financiera (Costo Total Estimado):</strong><ul className="list-disc ml-4 mt-1"><li><strong>Capital Inmovilizado (20% del costo unitario)</strong></li><li><strong>Ventas Perdidas (1.5x Costo Unitario)</strong></li><li><strong>Rupturas Operativas (10x Costo Unit. por día)</strong></li></ul></div>
                        </div>
                        {commonParams.length > 0 && engine.currentScenarios.length > 0 && (
                            <div className="px-5 py-3 bg-white border-b flex-shrink-0 shadow-sm relative z-10">
                                <div className="font-bold text-[9px] text-gray-400 mb-2 uppercase tracking-wider flex items-center gap-1"><span>📌 {engine.currentScenarios.length === 1 ? 'Parámetros del Escenario Único' : 'Parámetros Base (Comunes a todos los escenarios)'}</span></div>
                                <div className="flex flex-wrap gap-2 text-[10px]">
                                    {commonParams.map(key => {
                                        const sampleParams = engine.currentScenarios[0].params;
                                        if (key === 'minMaxFactor' && sampleParams.bufferMethod === 'DDMRP Estándar') return null; if (key === 'minCoverage' && sampleParams.bufferMethod === 'MinMax Dinámico') return null; if (key === 'historyDays' && sampleParams.aduType === 'Futuro') return null; if (key === 'futureDays' && sampleParams.aduType === 'Histórico') return null;
                                        return <div key={`common-${key}`} className="flex items-center bg-gray-50 border border-gray-200 rounded-md overflow-hidden shadow-sm"><span className="bg-gray-100 text-gray-600 px-2 py-1 font-medium border-r border-gray-200">{paramLabels[key]}</span><span className="px-2 py-1 font-bold text-indigo-900 bg-white">{getParamDisplayValue(sampleParams[key])}</span></div>
                                    })}
                                </div>
                            </div>
                        )}
                        <div className="p-4 flex flex-col overflow-auto h-full bg-gray-100">
                            {engine.currentScenarios.length === 0 ? ( <div className="text-center text-gray-500 py-10 font-medium">No hay escenarios guardados para este producto y bodega.</div> ) : (
                                <div className="flex gap-4 overflow-x-auto pb-4 pt-5 justify-center px-2">
                                    {engine.currentScenarios.map((sc, idx) => {
                                        const isBest = bestIds.includes(sc.id);
                                        return (
                                            <div key={sc.id} className={`min-w-[260px] max-w-[300px] bg-white border-2 rounded-lg shadow-md flex flex-col relative ${isBest ? 'border-green-500' : 'border-gray-200'}`}>
                                                {isBest && ( <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-green-500 text-white text-[10px] font-bold px-3 py-0.5 rounded-full shadow whitespace-nowrap">🏆 MEJOR OPCIÓN</div> )}
                                                <div className={`p-2 border-b font-bold text-center text-xs flex justify-between items-center ${isBest ? 'bg-green-50 text-green-900 pt-3' : 'bg-indigo-50 text-indigo-900'}`}><span>Escenario {idx + 1}</span><button onClick={()=>engine.handleDeleteScenario(sc.id)} className="text-red-400 hover:text-red-600 text-lg leading-none" title="Eliminar Escenario">&times;</button></div>
                                                <div className="p-3 flex-grow text-[11px]">
                                                   {differingParams.length > 0 ? ( <><div className="font-bold text-orange-700 border-b border-orange-200 mb-1.5 pb-1">Parámetros Diferentes</div>{differingParams.map(key => { if (key === 'minMaxFactor' && sc.params.bufferMethod === 'DDMRP Estándar') return null; if (key === 'minCoverage' && sc.params.bufferMethod === 'MinMax Dinámico') return null; if (key === 'historyDays' && sc.params.aduType === 'Futuro') return null; if (key === 'futureDays' && sc.params.aduType === 'Histórico') return null; return ( <div key={`diff-${key}`} className="flex justify-between mb-0.5 font-medium text-black"><span>{paramLabels[key]}:</span><span className="bg-orange-100 px-1 rounded">{getParamDisplayValue(sc.params[key])}</span></div> ); })}</> ) : ( <div className="text-gray-400 text-[10px] italic text-center mb-2 bg-gray-50 py-2 rounded border border-gray-200">Sin diferencias paramétricas.</div> )}
                                                    <div className="font-bold text-indigo-700 border-b border-indigo-200 mb-1.5 pb-1 mt-4">Desempeño y Costos</div>
                                                    <div className={`flex justify-between mb-1.5 p-1 rounded font-bold ${isBest ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-700'}`}><span>Costo Total Estimado:</span><span>${scores[sc.id]?.costoTotalEstimado.toLocaleString('es-CO', { maximumFractionDigits: 0 })}</span></div>
                                                    <div className="flex justify-between mb-0.5"><span>Fill Rate:</span><span className={parseFloat(sc.metrics.fillRate)<95 ? 'text-red-600 font-bold' : 'text-green-600 font-bold'}>{sc.metrics.fillRate}%</span></div>
                                                    <div className="flex justify-between mb-0.5"><span>Días de Ruptura:</span><span className={sc.metrics.rupturas>0 ? 'text-red-600 font-bold' : 'text-green-600 font-bold'}>{sc.metrics.rupturas} d</span></div>
                                                    <div className="flex justify-between mb-0.5"><span>Inventario Promedio:</span><span>{sc.metrics.invProm} und</span></div><div className="flex justify-between mb-0.5 font-medium bg-gray-50 px-1"><span>Costo Inv. Promedio:</span><span>{sc.metrics.invPromVal}</span></div>
                                                    <div className="flex justify-between mb-0.5 mt-1"><span>Consumo Perdido:</span><span>{sc.metrics.totalPerdido} und</span></div><div className="flex justify-between mb-0.5"><span>Cobertura Promedio:</span><span>{sc.metrics.cobProm} d</span></div>
                                                </div>
                                                <div className="p-2 border-t bg-gray-50 mt-auto"><button onClick={()=>engine.handlePromoteScenario(sc)} className={`w-full font-medium py-1.5 rounded shadow-sm transition text-xs ${isBest ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-indigo-100 hover:bg-indigo-200 text-indigo-800'}`}>★ Elegir como Maestro</button></div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE VISUAL PRINCIPAL: UI del Simulador ---
        
function SimulatorMasterModal({ engine, logistics, logisticsColumns, SmartTable, cascadeDelete, setSelectedProd, setSelectedNode }) {
            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-2 md:p-4 animate-fadeIn">

                        </div>
                        <div className="p-3 flex-grow overflow-auto bg-gray-100">
                            <SmartTable 
                                columns={logisticsColumns} 
                                data={logistics}

                        </div>
                        <div className="bg-gray-50 p-3 border-t flex justify-end">
                            <button onClick={() => engine.setIsModalOpen(false)} className="px-5 py-1.5 bg-gray-500 text-white rounded text-xs font-bold hover:bg-gray-600 transition shadow">Cerrar Tabla</button>
                        </div>
                    </div>
                </div>
            );
        }


function Paso3Simulador(props) {
            const engine = useSimulatorEngine(props);
            const { products, nodes, logistics, selectedCompany, setSelectedCompany, selectedProd, setSelectedProd, selectedNode, setSelectedNode, simForm, setSimForm, simParams, showChart, setShowChart, cascadeDelete, SmartTable, logisticsColumns } = props;

            // SOLUCIÓN: Usamos useEffect para que el "cerebro" se actualice en silencio 
            // DESPUÉS de que React termine de dibujar la pantalla. (Evita la pantalla blanca)
            useEffect(() => {
                window.geminiContext = window.geminiContext || {};
                if (simParams) window.geminiContext.parametros = simParams;
                if (engine && engine.simulationMetrics) {
                    window.geminiContext.metricas = engine.simulationMetrics;
                }
            }, [simParams, engine]);

            return (
                // Se corrigió el md:flex-row a flex-col para que el Header no se ponga de lado
                <div className="flex flex-col h-full gap-2 p-2">
                    <SimulatorHeader engine={engine} selectedCompany={selectedCompany} setSelectedCompany={setSelectedCompany} selectedProd={selectedProd} setSelectedProd={setSelectedProd} selectedNode={selectedNode} setSelectedNode={setSelectedNode} logistics={logistics} products={products} nodes={nodes} />

                    {!selectedProd || !selectedNode ? (
                        <div className="flex-grow flex items-center justify-center border-2 border-dashed border-gray-200 rounded-lg text-gray-400">Selecciona Compañía, Producto y Bodega para comenzar.</div>
                    ) : (
                        <div className="flex flex-col md:flex-row gap-3 flex-grow overflow-hidden relative">
                            <SimulatorParamsPanel engine={engine} simForm={simForm} setSimForm={setSimForm} simParams={simParams} nodes={nodes} selectedNode={selectedNode} selectedProd={selectedProd} cascadeDelete={cascadeDelete} logistics={logistics} />
                            <SimulatorChartAndGrid engine={engine} simParams={simParams} showChart={showChart} setShowChart={setShowChart} />
                        </div>
                    )}

                   {/* MODALES DEL SIMULADOR */}
                    {engine.isEventsModalOpen && <SimulatorEventsModal engine={engine} simForm={simForm} setSimForm={setSimForm} />}
                    {engine.isScenarioModalOpen && <SimulatorScenariosModal engine={engine} selectedProd={selectedProd} selectedNode={selectedNode} products={products} nodes={nodes} />}
                    
                    {engine.isModalOpen && (
                        <SimulatorMasterModal 
                            engine={engine} 
                            logistics={logistics} 
                            logisticsColumns={logisticsColumns} 
                            SmartTable={SmartTable} 
                            cascadeDelete={cascadeDelete} 
                            setSelectedProd={setSelectedProd} 
                            setSelectedNode={setSelectedNode} 
                        />
                    )}
                </div>
            );
        } // <-- ESTA LLAVE CIERRA LA FUNCIÓN Paso3Simulador

        // ==========================================
        // ARRANQUE DE LA APLICACIÓN
        // ==========================================
        ReactDOM.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>, 
            document.getElementById('root')
        );

    </script>
</body>
</html>
