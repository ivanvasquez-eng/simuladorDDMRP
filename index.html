                                orderCycle: orderCycle !== '' ? orderCycle : currentLogs[existingIndex].orderCycle, 
                                moq: moq !== '' ? moq : currentLogs[existingIndex].moq, 
                                packQty: packQty !== '' ? packQty : currentLogs[existingIndex].packQty,
                                consumptionType: consumptionType.length > 0 ? consumptionType : currentLogs[existingIndex].consumptionType,
                                consumingPlants: consumingPlants.length > 0 ? consumingPlants : currentLogs[existingIndex].consumingPlants
                            }; 
                            updateCount++; 
                        } else { 
                            currentLogs.push({ ...defaultSimForm, company, prodCode, nodeCode, supplyType, originNode, lt, orderCycle, moq, packQty, consumptionType, consumingPlants }); 
                            newCount++; 
                        }
                    }
                    setLogistics(currentLogs); 
                    alert(`✅ Importación exitosa:\n- ${updateCount} enlaces actualizados\n- ${newCount} enlaces nuevos`); 
                    e.target.value = null; setShowImportHelp(false);
                };
                reader.readAsText(file);
            };

            const columns = [ 
                { key: 'company', label: 'Cía.' }, 
                { key: 'prodCode', label: 'Producto' }, 
                { key: 'nodeCode', label: 'Bodega' }, 
                { key: 'supplyType', label: 'Tipo Abast.' }, 
                { key: 'originNode', label: 'Origen' }, 
                { key: 'lt', label: 'LT' }, 
                { key: 'orderCycle', label: 'Frec.' }, 
                { key: 'moq', label: 'MOQ' }, 
                { key: 'packQty', label: 'Empaque' }, 
                { key: 'consumptionType', label: 'Nat. Salida' }, 
                { key: 'consumingPlants', label: 'Plantas Dest.' }
            ];

            return (
                <div className="flex flex-col h-full overflow-hidden">
                    <div className="bg-orange-50 p-2 rounded border border-orange-200 mb-2 flex flex-col gap-1.5 flex-shrink-0 shadow-sm">
                        {/* FILA 1 */}
                        <div className="grid grid-cols-2 md:grid-cols-12 gap-1.5 items-end">
                            <div className="md:col-span-2">
                                <label className="block text-[9px] font-bold text-gray-700 mb-0.5">Compañía *</label>
                                {/* SELECTOR DE COMPAÑÍA */}
                                <select disabled={isEditing} value={form.company} onChange={e => setForm({...form, company: e.target.value, prodCode: '', nodeCode: '', originNode: '', consumingPlants: []})} className="w-full border p-1 rounded text-[10px] bg-white disabled:bg-gray-100 font-bold text-blue-900">
                                    {availableCompanies.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-[9px] font-bold text-gray-700 mb-0.5">Producto *</label>
                                {/* FILTRADO POR COMPAÑÍA */}
                                <select disabled={isEditing} value={form.prodCode} onChange={e=>setForm({...form, prodCode: e.target.value})} className="w-full border p-1 rounded text-[10px] bg-white disabled:bg-gray-100">
                                    <option value="">-- Elige --</option>
                                    {filteredProducts.map(p => <option key={p.code} value={p.code}>{p.code}</option>)}
                                </select>
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-[9px] font-bold text-gray-700 mb-0.5">Bodega *</label>
                                {/* FILTRADO POR COMPAÑÍA */}
                                <select disabled={isEditing} value={form.nodeCode} onChange={e=>setForm({...form, nodeCode: e.target.value})} className="w-full border p-1 rounded text-[10px] bg-white disabled:bg-gray-100">
                                    <option value="">-- Elige --</option>
                                    {filteredNodes.map(n => <option key={n.code} value={n.code}>{n.code}</option>)}
                                </select>
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-[9px] font-bold text-gray-700 mb-0.5">Tipo Abast.</label>
                                <select value={form.supplyType} onChange={e=>setForm({...form, supplyType: e.target.value})} className="w-full border p-1 rounded text-[10px] bg-white">
                                    <option value="Comprado">Compra</option><option value="Manufacturado">Manuf.</option><option value="Distribuido">Distrib.</option>
                                </select>
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-[9px] font-bold text-gray-700 mb-0.5">Bodega Origen (Opcional)</label>
                                {/* FILTRADO POR COMPAÑÍA (Excluyendo nodo actual) */}
                                <select value={form.originNode} onChange={e=>setForm({...form, originNode: e.target.value})} className="w-full border p-1 rounded text-[10px] bg-white">
                                    <option value="">-- Externo --</option>
                                    {filteredNodes.filter(n => n.code !== form.nodeCode).map(n => <option key={n.code} value={n.code}>{n.code}</option>)}
                                </select>
                            </div>
                            <div className="md:col-span-1"><label className="block text-[9px] font-bold text-gray-700 mb-0.5 text-center">LT (d)</label><input type="number" min="0" value={form.lt} onChange={e=>setForm({...form, lt: e.target.value})} className="w-full border p-1 rounded text-[10px] text-center bg-white" /></div>
                            <div className="md:col-span-1"><label className="block text-[9px] font-bold text-gray-700 mb-0.5 text-center">Frec (d)</label><input type="number" min="0" value={form.orderCycle} onChange={e=>setForm({...form, orderCycle: e.target.value})} className="w-full border p-1 rounded text-[10px] text-center bg-white" /></div>
                        </div>

                        {/* FILA 2 */}
                        <div className="grid grid-cols-2 md:grid-cols-12 gap-1.5 items-end">
                            <div className="md:col-span-1"><label className="block text-[9px] font-bold text-gray-700 mb-0.5 text-center">MOQ</label><input type="number" min="0" step="any" value={form.moq} onChange={e=>setForm({...form, moq: e.target.value})} className="w-full border p-1 rounded text-[10px] text-center bg-white" /></div>
                            <div className="md:col-span-1"><label className="block text-[9px] font-bold text-gray-700 mb-0.5 text-center">Empaque</label><input type="number" min="0" step="any" value={form.packQty} onChange={e=>setForm({...form, packQty: e.target.value})} className="w-full border p-1 rounded text-[10px] text-center bg-white" /></div>
                            
                            <div className={`md:col-span-${Array.isArray(form.consumptionType) && form.consumptionType.includes('Consumo en Producción') ? '4' : '7'} bg-green-50 border border-green-200 p-1 rounded flex items-center gap-1.5 min-h-[26px]`}>
                                <span className="text-[8px] font-bold text-green-800 uppercase pl-1">Salida:</span>
                                <div className="flex gap-1 flex-wrap">
                                    {[{v:'Venta', l:'Venta'}, {v:'Consumo Interno', l:'Interno'}, {v:'Consumo en Producción', l:'Producción'}, {v:'Distribución', l:'Distrib.'}].map(tipo => {
                                        let isChecked = Array.isArray(form.consumptionType) && form.consumptionType.includes(tipo.v);
                                        return (
                                            <label key={tipo.v} className={`cursor-pointer px-1.5 py-0.5 border rounded text-[8px] font-bold transition-colors ${isChecked ? 'bg-green-600 text-white border-green-700 shadow-inner' : 'bg-white text-gray-600 hover:bg-green-100 border-gray-300'}`}>
                                                <input type="checkbox" className="hidden" checked={isChecked} onChange={(e) => {
                                                    let current = Array.isArray(form.consumptionType) ? [...form.consumptionType] : [];
                                                    let currentPlants = Array.isArray(form.consumingPlants) ? [...form.consumingPlants] : [];
                                                    if (e.target.checked) current.push(tipo.v);
                                                    else { current = current.filter(t => t !== tipo.v); if (tipo.v === 'Consumo en Producción') currentPlants = []; }
                                                    setForm({...form, consumptionType: current, consumingPlants: currentPlants});
                                                }} />
                                                {tipo.l}
                                            </label>
                                        )
                                    })}
                                </div>
                            </div>

                            {Array.isArray(form.consumptionType) && form.consumptionType.includes('Consumo en Producción') && (
                                <div className="md:col-span-3 bg-white border border-indigo-200 p-1 rounded flex items-center gap-1.5 overflow-x-auto min-h-[26px]">
                                    <span className="text-[8px] font-bold text-indigo-800 uppercase pl-1">Plantas:</span>
                                    <div className="flex gap-1 flex-nowrap">
                                        {/* FILTRADO POR COMPAÑÍA PARA PLANTAS */}
                                        {filteredNodes.filter(n => n.nodeType === 'Planta' && n.code !== form.nodeCode).map(planta => {
                                            let isPlantChecked = Array.isArray(form.consumingPlants) && form.consumingPlants.includes(planta.code);
                                            return (
                                                <label key={planta.code} className={`cursor-pointer px-1.5 py-0.5 border rounded text-[8px] font-bold whitespace-nowrap transition-colors ${isPlantChecked ? 'bg-indigo-600 text-white border-indigo-700 shadow-inner' : 'bg-gray-50 text-gray-600 hover:bg-indigo-100 border-gray-300'}`}>
                                                    <input type="checkbox" className="hidden" checked={isPlantChecked} onChange={(e) => {
                                                        let currentP = Array.isArray(form.consumingPlants) ? [...form.consumingPlants] : [];
                                                        if (e.target.checked) currentP.push(planta.code); else currentP = currentP.filter(p => p !== planta.code);
                                                        setForm({...form, consumingPlants: currentP});
                                                    }} />
                                                    {planta.code}
                                                </label>
                                            );
                                        })}
                                        {filteredNodes.filter(n => n.nodeType === 'Planta' && n.code !== form.nodeCode).length === 0 && <span className="text-[8px] text-red-500 italic pr-1">No hay Plantas.</span>}
                                    </div>
                                </div>
                            )}

                            <div className="md:col-span-3 flex justify-end gap-1 ml-auto min-h-[26px] items-center w-full">
                                {isEditing && <button onClick={handleCancel} className="px-3 py-1 border border-gray-300 rounded text-[9px] bg-white font-bold text-gray-600 hover:bg-gray-50 shadow-sm transition-colors">X Cancelar</button>}
                                <button onClick={handleSave} className="px-4 py-1 text-white font-bold rounded text-[10px] bg-orange-600 hover:bg-orange-700 shadow-sm transition-colors w-full md:w-auto">{isEditing ? 'Actualizar Enlace' : '+ Enlazar'}</button>
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-col gap-2 flex-shrink-0 my-2">
                        <div className="flex justify-between items-center">
                            <div className="flex gap-1 items-center">
                                <label className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded text-[10px] border border-indigo-200 cursor-pointer shadow-sm transition">
                                    📥 Importar CSV <input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" />
                                </label>
                                <button onClick={() => setShowImportHelp(!showImportHelp)} className={`px-2 py-0.5 rounded border transition text-[11px] font-bold ${showImportHelp ? 'bg-indigo-200 text-indigo-800 border-indigo-300' : 'bg-white text-gray-400 hover:bg-gray-100 border-gray-200'}`} title="Ver reglas del formato CSV">{showImportHelp ? '✖' : 'ⓘ'}</button>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={handleExport} className="bg-gray-100 px-3 py-1 rounded text-[10px] border font-medium hover:bg-gray-200 transition">📊 Exportar</button>
                                <button onClick={handlePullFromSheets} disabled={isSaving} className="px-3 py-1 rounded text-[10px] font-medium text-emerald-800 bg-emerald-100 border border-emerald-300 hover:bg-emerald-200 transition shadow-sm">☁ Bajar Nube</button>
                                <button onClick={handleSyncDB} disabled={isSaving || logistics.length===0} className="px-3 py-1 rounded text-[10px] font-medium text-white bg-green-600 hover:bg-green-700 transition shadow-sm">☁️ Subir Nube</button>
                            </div>
                        </div>
                        {showImportHelp && ( 
                            <div className="bg-indigo-50 border border-indigo-200 text-indigo-800 p-2.5 rounded text-[9px] shadow-inner animate-fadeIn"> 
                                <strong className="block mb-1 border-b border-indigo-200 pb-1 text-[10px]">📋 Reglas del Archivo CSV (Matriz):</strong> 
                                <ul className="list-disc pl-4 space-y-1 mt-1.5"> 
                                    <li><strong>Columnas Obligatorias:</strong> <code className="bg-white px-1 rounded font-bold">Producto</code> y <code className="bg-white px-1 rounded font-bold">Bodega</code>.</li> 
                                    <li><strong>Opcional:</strong> Compania (asigna WA por defecto), Tipo Abast, Origen, LT, Frecuencia, MOQ, Empaque, Nat Consumo, Plantas Destino.</li> 
                                    <li><em className="text-indigo-600">Nota: Solo se actualizarán los campos provistos; el resto de configuraciones se conservarán.</em></li> 
                                </ul> 
                            </div> 
                        )}
                    </div>

                    <SmartTable columns={columns} data={logistics} onEdit={(l)=>{setForm({...l, company: l.company || 'WA'}); setIsEditing(true);}} onDelete={(l)=>{
                        cascadeDelete('logistics', l);
                    }} itemName="enlaces matriz" />
                </div>
            );
        }
        function Paso1RedInner({ products, nodes, logistics, history }) {
            const chartRef = useRef(null);
            const [filterCompany, setFilterCompany] = useState('');
            const [filterProd, setFilterProd] = useState('');
            const [filterNode, setFilterNode] = useState('');

            useEffect(() => {
                if (!chartRef.current) return;
                
                // --- 1. CÁLCULO DE VOLUMETRÍA Y VALORIZACIÓN POR BODEGA ---
                let nodeStats = {};
                nodes.forEach(n => { nodeStats[n.code] = { skuCount: 0, totalAduValue: 0, prods: [] }; });

                (logistics || []).forEach(l => {
                    if (!l || !l.nodeCode) return;
                    if (!nodeStats[l.nodeCode]) nodeStats[l.nodeCode] = { skuCount: 0, totalAduValue: 0, prods: [] };
                    
                    let prod = products.find(p => p.code === l.prodCode);
                    let cost = prod ? (parseFloat(String(prod.cost ?? prod.costo ?? 0).replace(/\$/g, '').replace(/,/g, '').trim()) || 0) : 0;
                    
                    let adu = 0;
                    let hKey = `${l.prodCode}_${l.nodeCode}`;
                    if (history && history[hKey]) {
                        let hData = history[hKey];
                        let histArray = Array.isArray(hData) ? hData : (hData.data || []);
                        if (histArray.length > 0) {
                            let sum = histArray.reduce((acc, curr) => acc + (parseFloat(curr.qty ?? curr.cantidad ?? 0) || 0), 0);
                            adu = sum / histArray.length;
                        }
                    }
                    
                    nodeStats[l.nodeCode].skuCount += 1;
                    nodeStats[l.nodeCode].totalAduValue += (adu * cost);
                    nodeStats[l.nodeCode].prods.push(l.prodCode);
                });

                let maxVal = 0;
                Object.values(nodeStats).forEach(s => { if (s.totalAduValue > maxVal) maxVal = s.totalAduValue; });

                // --- 2. CONSTRUCCIÓN DE LA RED E2E (ENLACES AGRUPADOS) ---
                let graphNodes = [], graphLinks = [], nodeSet = new Set(), addedGroups = new Set();
                let virtualSuppliers = new Set(), virtualClients = new Set();
                
                let logsToProcess = logistics || [];
                if (filterCompany) logsToProcess = logsToProcess.filter(l => (l.company || 'WA') === filterCompany);
                if (filterProd) logsToProcess = logsToProcess.filter(l => l.prodCode === filterProd);
                if (filterNode) logsToProcess = logsToProcess.filter(l => l.nodeCode === filterNode || l.originNode === filterNode || l.supplier === filterNode);

                let aggregatedLinks = {};
                const addAggregatedLink = (source, target, type, prod, lt, lineStyle, labelShow) => {
                    let key = `${source}|${target}|${type}`;
                    if (!aggregatedLinks[key]) {
                        aggregatedLinks[key] = { source, target, type, lineStyle, prods: new Set(), lts: new Set(), labelShow };
                    }
                    aggregatedLinks[key].prods.add(prod);
                    if (lt !== undefined && lt !== null && lt !== '') aggregatedLinks[key].lts.add(lt);
                };

                logsToProcess.forEach(l => { 
                    let currentNode = l.nodeCode ? l.nodeCode.trim() : null;
                    if (!currentNode) return;
                    nodeSet.add(currentNode);
                    
                    let c = l.company || 'WA'; 

                    // A. FLUJO DE ENTRADA (Inbound)
                    if (l.supplyType === 'Comprado') {
                        if (l.originNode) {
                            let origNode = l.originNode.trim();
                            nodeSet.add(origNode);
                            addAggregatedLink(origNode, currentNode, 'Compra Intercompañía', l.prodCode, l.lt, { type: 'dashed', color: '#10b981', width: 2, curveness: 0.15 }, filterProd !== '');
                        } else {
                            let suppId = `SUPP|${c}`;
                            virtualSuppliers.add(suppId);
                            addAggregatedLink(suppId, currentNode, 'Prov. Externos', l.prodCode, l.lt, { type: 'dashed', color: '#9ca3af', width: 2, curveness: 0.15 }, filterProd !== '');
                        }
                    } else {
                        let origNode = l.originNode ? l.originNode.trim() : null;
                        if (origNode) {
                            nodeSet.add(origNode);
                            addAggregatedLink(origNode, currentNode, 'Traslado Interno', l.prodCode, l.lt, { type: 'solid', color: '#3b82f6', width: 2, curveness: 0.15 }, filterProd !== '');
                        }
                    }

                    // B. FLUJO DE SALIDA (Outbound / Consumo)
                    let cTypes = l.consumptionType || []; 
                    let isPOS = nodes.find(n => n.code === currentNode)?.nodeType === 'Punto de Venta';
                    
                    let mktId = `MKT|${c}`; 
                    let intId = `INT|${c}`; 
                    
                    if (cTypes.includes('Venta') || (cTypes.length === 0 && isPOS)) {
                        virtualClients.add(mktId);
                        addAggregatedLink(currentNode, mktId, 'Salida a Ventas', l.prodCode, null, { type: 'dotted', color: '#10b981', width: 2, curveness: 0.15 }, false);
                    }
                    
                    if (cTypes.includes('Consumo Interno')) {
                        virtualClients.add(intId);
                        addAggregatedLink(currentNode, intId, 'Consumo en Planta', l.prodCode, null, { type: 'dotted', color: '#f59e0b', width: 2, curveness: 0.15 }, false);
                    }

                    if (cTypes.includes('Consumo en Producción')) {
                        if (Array.isArray(l.consumingPlants) && l.consumingPlants.length > 0) {
                            l.consumingPlants.forEach(plantaDestino => {
                                let destNode = plantaDestino.trim();
                                nodeSet.add(destNode);
                                addAggregatedLink(currentNode, destNode, 'Flujo a Producción', l.prodCode, null, { type: 'dashed', color: '#6366f1', width: 2, curveness: 0.2 }, false);
                            });
                        } else {
                            virtualClients.add(intId);
                            addAggregatedLink(currentNode, intId, 'Consumo en Planta', l.prodCode, null, { type: 'dotted', color: '#f59e0b', width: 2, curveness: 0.15 }, false);
                        }
                    }
                });

                const formatNodeName = (id) => {
                    if (id.startsWith('SUPP|')) return `Prov. Externos (${id.split('|')[1]})`;
                    if (id.startsWith('MKT|')) return `Mercado (${id.split('|')[1]})`;
                    if (id.startsWith('INT|')) return `Consumo Int. (${id.split('|')[1]})`;
                    return id;
                };

                Object.values(aggregatedLinks).forEach(edge => {
                    let prodsArr = Array.from(edge.prods);
                    let ltsArr = Array.from(edge.lts);
                    let prodsText = prodsArr.length > 3 ? `${prodsArr.slice(0,3).join(', ')} y ${prodsArr.length - 3} más` : prodsArr.join(', ');
                    let ltText = ltsArr.length > 0 ? `LT: ${ltsArr.join('/')}d` : '';
                    
                    let labelFormatter = edge.labelShow && ltText ? ltText : '';
                    let tooltipHtml = `<b>${formatNodeName(edge.source)} ➔ ${formatNodeName(edge.target)}</b><br/>Tipo: ${edge.type}<br/>Productos: ${prodsText}`;
                    if (ltsArr.length > 0) tooltipHtml += `<br/>Lead Times: <b>${ltsArr.join('/')} días</b>`;

                    graphLinks.push({
                        source: edge.source, target: edge.target,
                        label: { show: edge.labelShow && labelFormatter !== '', formatter: labelFormatter, fontSize: 9, backgroundColor: '#ffffff', padding: 2, borderRadius: 3, borderColor: edge.lineStyle.color, borderWidth: 1 },
                        lineStyle: edge.lineStyle,
                        tooltip: { formatter: tooltipHtml }
                    });
                });

                // --- 3. CREACIÓN DE AGRUPACIONES JERÁRQUICAS TEXTUALES (Compañía -> Attr 1) ---
                Array.from(nodeSet).forEach(nCode => {
                    const nData = nodes.find(n => n.code === nCode);
                    if (nData) {
                        let c = nData.company || 'WA';
                        let a1 = nData.attr1 ? nData.attr1.trim() : null;

                        let cId = `GRP_C_${c}`;
                        let a1Id = a1 ? `GRP_A1_${c}_${a1}` : null;

                        if (!addedGroups.has(cId)) {
                            graphNodes.push({
                                id: cId, name: cId, nodeType: 'Cluster',
                                symbol: 'circle', symbolSize: 1, 
                                itemStyle: { color: 'transparent', borderColor: 'transparent' },
                                label: { show: true, formatter: `🏢 ${c}`, fontSize: 16, fontWeight: 'bold', color: '#1e3a8a', position: 'inside' },
                                tooltip: { formatter: `Base de Operaciones: <b>${c}</b>` }
                            });
                            addedGroups.add(cId);
                        }

                        let linkTargetId = cId; 

                        if (a1Id) {
                            if (!addedGroups.has(a1Id)) {
                                graphNodes.push({
                                    id: a1Id, name: a1Id, nodeType: 'Cluster',
                                    symbol: 'circle', symbolSize: 1,
                                    itemStyle: { color: 'transparent', borderColor: 'transparent' },
                                    label: { show: true, formatter: `📁 ${a1}`, fontSize: 12, fontWeight: 'bold', color: '#0369a1', position: 'inside' },
                                });
                                graphLinks.push({ source: cId, target: a1Id, lineStyle: { width: 0 }, value: 10 });
                                addedGroups.add(a1Id);
                            }
                            linkTargetId = a1Id; 
                        }

                        graphLinks.push({ source: linkTargetId, target: nCode, lineStyle: { width: 0 }, value: 1 });
                    }
                });

                // --- 4. NODOS VIRTUALES EXTERNOS (Geometría Estándar SCM) ---
                virtualSuppliers.forEach(vsId => {
                    let c = vsId.split('|')[1];
                    graphNodes.push({ 
                        id: vsId, name: vsId, nodeType: 'Origen Externo', 
                        symbol: 'diamond', symbolSize: 28,  // Rombo: Entidad Externa / Origen
                        itemStyle: { color: '#64748b', borderColor: '#ffffff', borderWidth: 1.5, shadowBlur: 3, shadowColor: 'rgba(0,0,0,0.2)' }, 
                        label: {show: true, formatter: `Prov. Externo\n(${c})`, fontSize: 9, position: 'bottom', color: '#4b5563', fontWeight: 'bold'} 
                    });
                    if(addedGroups.has(`GRP_C_${c}`)) graphLinks.push({ source: `GRP_C_${c}`, target: vsId, lineStyle: { width: 0 }, value: 1 });
                });
                
                virtualClients.forEach(vcId => {
                    let parts = vcId.split('|');
                    let type = parts[0];
                    let c = parts[1];
                    let isConsumo = type === 'INT';

                    graphNodes.push({ 
                        id: vcId, name: vcId, nodeType: isConsumo ? 'Consumo Interno' : 'Mercado', 
                        symbol: 'circle', symbolSize: 26,  // Círculo: Cliente / Destino final
                        itemStyle: { color: isConsumo ? '#b45309' : '#047857', borderColor: '#ffffff', borderWidth: 1.5, shadowBlur: 3, shadowColor: 'rgba(0,0,0,0.2)' }, 
                        label: {show: true, formatter: isConsumo ? `Consumo Int.\n(${c})` : `Mercado\n(${c})`, fontSize: 9, position: 'bottom', fontWeight: 'bold', color: isConsumo ? '#b45309' : '#047857'} 
                    });
                    if(addedGroups.has(`GRP_C_${c}`)) graphLinks.push({ source: `GRP_C_${c}`, target: vcId, lineStyle: { width: 0 }, value: 1 });
                });

                // --- 5. DICCIONARIO GEOMÉTRICO (ESTÁNDARES SCM/VSM) ---
                const getStyle = (type) => {
                    switch(type) {
                        case 'Planta': 
                            return { color: '#1d4ed8', symbol: 'rect', size: 32 }; // Cuadrado grande (Proceso de Manufactura)
                        case 'CEDI Principal': 
                            return { color: '#7e22ce', symbol: 'triangle', size: 28 }; // Triángulo (Inventario Principal)
                        case 'CEDI Regional':

// ======================= MÓDULO 2: DEMANDA HISTÓRICA =======================
        
// --- CUSTOM HOOK: Cerebro de la Demanda ---
        function useDemandManager({ products, nodes, history, setHistory, scenarios, selectedCompany, selectedProd, selectedNode }) {
            const [params, setParams] = useState({ startDate: new Date().toISOString().split('T')[0], months: 12, year2Factor: 1.0, adu: 20, adi: 7, stdDev: '', minQty: '', maxQty: '', distModel: 'normal', useWeeklySeasonality: 'No' });
            const [seasonality, setSeasonality] = useState(Array(12).fill(1));
            const [weeklySeasonality, setWeeklySeasonality] = useState([15, 15, 15, 15, 20, 20, 0]);
            
            const [rawDemandData, setRawDemandData] = useState(null);
            const [metrics, setMetrics] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [importState, setImportState] = useState({ isOpen: false, data: [], errors: [], types: [], selectedTypes: {} });
            const [showImportHelp, setShowImportHelp] = useState(false);
            const [showDistHelp, setShowDistHelp] = useState(false); // NUEVO ESTADO DE AYUDA
            const [forecastConfig, setForecastConfig] = useState({ bucket: 'monthly', mape: 15 });
            const [forecastData, setForecastData] = useState(null);
            const [timeView, setTimeView] = useState('daily');

            useEffect(() => {
                if (selectedProd && selectedNode) {
                    const key = `${selectedProd}_${selectedNode}`;
                    if (history[key]) {
                        const loadedData = history[key].data ? history[key].data.map(d => ({ date: new Date(d.date), qty: d.qty })) : [];
                        const loadedForecast = history[key].forecastData ? history[key].forecastData.map(d => ({ date: new Date(d.date), qty: d.qty })) : null;
                        
                        setRawDemandData(loadedData);
                        setForecastData(loadedForecast);
                        
                        setParams(history[key].params || { startDate: new Date().toISOString().split('T')[0], months: 12, year2Factor: 1.0, adu: 20, adi: 7, stdDev: '', minQty: '', maxQty: '', distModel: 'normal', useWeeklySeasonality: 'No' });
                        setSeasonality(history[key].seasonality || Array(12).fill(1));
                        setWeeklySeasonality(history[key].weeklySeasonality || [15, 15, 15, 15, 20, 20, 0]);
                        
                        setMetrics(calculateDemandMetrics(loadedData, loadedForecast));
                        
                        if (history[key].forecastParams) setForecastConfig(history[key].forecastParams);
                    } else { 
                        setRawDemandData(null); 
                        setMetrics(null); 
                        setForecastData(null); 
                    }
                } else { 
                    setRawDemandData(null); 
                    setMetrics(null); 
                    setForecastData(null); 
                }
            }, [selectedProd, selectedNode, history]);

            const getCalculatedEndDate = () => {
                if (!params.startDate) return "-";
                let d = new Date(params.startDate + 'T12:00:00'), m = parseInt(params.months);
                if (isNaN(m) || m < 1) m = 1; d.setMonth(d.getMonth() + m); d.setDate(d.getDate() - 1);
                return formatShortDate(d.toISOString());
            };

            const handlePosFloatBlur = (e, field) => { let val = parseFloat(e.target.value); if (isNaN(val) || val <= 0) val = 0.1; setParams(prev => ({...prev, [field]: val})); };
            const handlePosIntBlur = (e, field) => { let val = parseInt(e.target.value, 10); if (isNaN(val) || val <= 0) val = 1; setParams(prev => ({...prev, [field]: val})); };

            const parseNumberIntelligently = (val) => {
                if (!val) return 0;
                let str = String(val).trim().replace(/["']/g, '');
                if (str.includes('.') && str.includes(',')) {
                    let lastDot = str.lastIndexOf('.'), lastComma = str.lastIndexOf(',');
                    if (lastComma > lastDot) str = str.replace(/\./g, '').replace(',', '.'); else str = str.replace(/,/g, '');
                } else if (str.includes(',')) { str = str.replace(',', '.'); }
                return Math.max(0, parseFloat(str) || 0);
            };

            const parseYYYYMMDD = (val) => {
                let str = String(val).trim(), parts = str.split(/[-/]/);
                if (parts.length === 3) {
                    let y, m, d;
                    if (parts[0].length === 4) { y = parseInt(parts[0]); m = parseInt(parts[1]) - 1; d = parseInt(parts[2]); } 
                    else if (parts[2].length === 4) { d = parseInt(parts[0]); m = parseInt(parts[1]) - 1; y = parseInt(parts[2]); }
                    let date = new Date(y, m, d);
                    if (date.getFullYear() === y && date.getMonth() === m && date.getDate() === d) return date;
                }
                let cleanStr = str.replace(/\D/g, '');
                if (cleanStr.length === 8) {
                    let y = parseInt(cleanStr.slice(0,4)), m = parseInt(cleanStr.slice(4,6))-1, d = parseInt(cleanStr.slice(6,8)), date = new Date(y, m, d);
                    if (date.getFullYear() === y && date.getMonth() === m && date.getDate() === d) return date;
                }
                return null;
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const lines = evt.target.result.split('\n').filter(l => l.trim() !== '');
                    if (lines.length < 2) return alert("El archivo está vacío o no tiene encabezados.");
                    const separator = lines[0].includes(';') ? ';' : ',';
                    const headers = parseCSVLine(lines[0].toLowerCase(), separator);
                    const idxProd = headers.findIndex(h => h.includes('producto')), idxNode = headers.findIndex(h => h.includes('bodega') || h.includes('bodega')), idxDate = headers.findIndex(h => h.includes('fecha')), idxQty = headers.findIndex(h => h.includes('cantidad') || h.includes('consumo')), idxType = headers.findIndex(h => h.includes('tipo'));

                    if (idxProd === -1 || idxNode === -1 || idxDate === -1 || idxQty === -1) return alert("Error: Falta columnas 'Producto', 'Bodega', 'Fecha' o 'Cantidad'.");

                    let parsedData = [], errors = [], typesSet = new Set();
                    for (let i = 1; i < lines.length; i++) {
                        const cols = parseCSVLine(lines[i], separator); if (!cols[idxProd]) continue;
                        let prodCodeRaw = cols[idxProd], nodeCodeRaw = cols[idxNode], dateStr = cols[idxDate], qtyStr = cols[idxQty], typeStr = idxType !== -1 ? (cols[idxType] || 'SIN CLASIFICAR') : 'SIN CLASIFICAR';
                        let errorMsg = [], pCodeNorm = String(prodCodeRaw).trim().toLowerCase(), nCodeNorm = String(nodeCodeRaw).trim().toLowerCase();
                        let matchedProd = products.find(p => String(p.code).trim().toLowerCase() === pCodeNorm && (p.company||'WA') === selectedCompany), matchedNode = nodes.find(n => String(n.code).trim().toLowerCase() === nCodeNorm && (n.company||'WA') === selectedCompany);
                        let prodCode = matchedProd ? matchedProd.code : prodCodeRaw, nodeCode = matchedNode ? matchedNode.code : nodeCodeRaw;

                        if (!matchedProd) errorMsg.push(`Producto no existe (${prodCodeRaw})`);
                        if (!matchedNode) errorMsg.push(`Bodega no existe (${nodeCodeRaw})`);
                        let parsedDate = parseYYYYMMDD(dateStr); if (!parsedDate) errorMsg.push(`Fecha inválida (${dateStr})`);
                        let parsedQty = parseNumberIntelligently(qtyStr);

                        if (errorMsg.length > 0) errors.push(`Fila ${i+1}: ${errorMsg.join(' - ')}`);
                        else { parsedData.push({ prodCode, nodeCode, date: parsedDate, qty: parsedQty, type: typeStr }); typesSet.add(typeStr); }
                    }
                    const initialSelectedTypes = {}; typesSet.forEach(t => initialSelectedTypes[t] = true);
                    setImportState({ isOpen: true, data: parsedData, errors, types: Array.from(typesSet), selectedTypes: initialSelectedTypes });
                    e.target.value = null; 
                };
                reader.readAsText(file);
            };

            const processRealImport = () => {
                const validData = importState.data.filter(d => importState.selectedTypes[d.type]), grouped = {};
                validData.forEach(d => { const key = `${d.prodCode}_${d.nodeCode}`; if (!grouped[key]) grouped[key] = []; grouped[key].push(d); });
                const newHistory = { ...history }, MS_IN_DAY = 86400000;
                let affectedScenarios = false;
                
                Object.keys(grouped).forEach(key => {
                    if (scenarios && scenarios[key] && scenarios[key].length > 0) affectedScenarios = true;
                    let records = grouped[key], dailySums = {};
                    records.forEach(r => { let sortKey = r.date.getTime(); if (!dailySums[sortKey]) dailySums[sortKey] = { date: r.date, qty: 0 }; dailySums[sortKey].qty += r.qty; });
                    const sortedTimes = Object.keys(dailySums).map(Number).sort((a,b) => a-b);
                    let minTime = sortedTimes[0], maxTime = sortedTimes[sortedTimes.length - 1];
                    // Límite de seguridad: máximo 2 años (730 días) para no saturar memoria
                    if (maxTime - minTime > 730 * MS_IN_DAY) maxTime = minTime + (730 * MS_IN_DAY);
                    
                    const finalSeries = []; let currTime = minTime;
                    while (currTime <= maxTime) { let qty = dailySums[currTime] ? dailySums[currTime].qty : 0; finalSeries.push({ date: new Date(currTime), qty }); currTime += MS_IN_DAY; }
                    
                    const metricsCalculadas = calculateDemandMetrics(finalSeries);
                    
                    // --- NUEVO: EXTRACCIÓN AUTOMÁTICA DE ESTACIONALIDAD MENSUAL E INTRASEMANAL ---
                    let monthSums = Array(12).fill(0), monthCounts = Array(12).fill(0), weekSums = Array(7).fill(0);
                    finalSeries.forEach(d => {
                        let jsMonth = d.date.getMonth();
                        monthSums[jsMonth] += d.qty; 
                        monthCounts[jsMonth]++;
                        
                        let jsDay = d.date.getDay();
                        let mappedDay = jsDay === 0 ? 6 : jsDay - 1; // Mapeamos: 0=Lu, ..., 6=Do
                        weekSums[mappedDay] += d.qty;
                    });
                    
                    // 1. Estacionalidad Mensual (Factores centrados en 1)
                    let globalDailyAvg = finalSeries.reduce((sum, d) => sum + d.qty, 0) / (finalSeries.length || 1);
                    let calcSeasonality = Array(12).fill(1);
                    if (globalDailyAvg > 0) {
                        for(let m = 0; m < 12; m++) {
                            if(monthCounts[m] > 0) {
                                let monthDailyAvg = monthSums[m] / monthCounts[m];
                                calcSeasonality[m] = parseFloat((monthDailyAvg / globalDailyAvg).toFixed(2));
                            }
                        }
                    }
                    
                    // 2. Estacionalidad Intrasemanal (Porcentajes que sumen 100%)
                    let totalWeekVolume = weekSums.reduce((a,b)=>a+b, 0);
                    let calcWeeklySeasonality = Array(7).fill(0);
                    let hasIntraWeekSeasonality = false;
                    
                    if (totalWeekVolume > 0) {
                        calcWeeklySeasonality = weekSums.map(s => parseFloat(((s / totalWeekVolume) * 100).toFixed(1)));
                        // Ajuste por redondeo para forzar que sume exactamente 100
                        let sum = calcWeeklySeasonality.reduce((a,b)=>a+b, 0);
                        if (sum !== 100) {
                            let maxIdx = calcWeeklySeasonality.indexOf(Math.max(...calcWeeklySeasonality));
                            calcWeeklySeasonality[maxIdx] = parseFloat((calcWeeklySeasonality[maxIdx] + (100 - sum)).toFixed(1));
                        }
                        // Activar el switch de intrasemanal automáticamente si detectamos un día con una desviación > 5% respecto a otro
                        let maxPct = Math.max(...calcWeeklySeasonality), minPct = Math.min(...calcWeeklySeasonality);
                        if (maxPct - minPct > 5) hasIntraWeekSeasonality = true;
                    } else {
                        calcWeeklySeasonality = [14.3, 14.3, 14.3, 14.3, 14.3, 14.3, 14.2]; // Fallback equitativo
                    }
                    // -------------------------------------------------------------------------------
                    
                    newHistory[key] = { 
                        params: { ...params, source: 'Real Importada', useWeeklySeasonality: hasIntraWeekSeasonality ? 'Si' : 'No' }, 
                        seasonality: calcSeasonality, 
                        weeklySeasonality: calcWeeklySeasonality,
                        metrics: metricsCalculadas, 
                        data: finalSeries.map(d => ({ date: d.date.toISOString(), qty: d.qty })) 
                    };
                });
                
                setHistory(newHistory);
                
                // Actualizamos los estados visuales en tiempo real si el producto importado es el que estamos viendo
                if (selectedProd && selectedNode && newHistory[`${selectedProd}_${selectedNode}`]) {
                    const h = newHistory[`${selectedProd}_${selectedNode}`];
                    setRawDemandData(h.data.map(d => ({ date: new Date(d.date), qty: d.qty }))); 
                    setMetrics(h.metrics);
                    setSeasonality(h.seasonality);
                    setWeeklySeasonality(h.weeklySeasonality);
                    setParams(h.params);
                }
                
                if (affectedScenarios) alert(`✅ Historia procesada. Patrones de estacionalidad detectados automáticamente.\n\n⚠️ ATENCIÓN: Revisar escenarios guardados.`);
                else alert(`✅ Historia procesada. Patrones de estacionalidad detectados para ${Object.keys(grouped).length} combinaciones.`);
                
                setImportState({ isOpen: false, data: [], errors: [], types: [], selectedTypes: {} });
            };

            const handleGenerateSynthetic = () => {
                if (!selectedProd || !selectedNode) return alert("Seleccione Producto y Bodega.");
                const key = `${selectedProd}_${selectedNode}`;
                if (scenarios && scenarios[key] && scenarios[key].length > 0) { if (!confirm(`⚠️ ATENCIÓN: Tienes escenarios guardados. ¿Sobrescribir demanda histórica?`)) return; }
                
                let generatedData = generateSyntheticDemand(params, seasonality, weeklySeasonality); 
                let dataWithDateObjs = generatedData.map(d => ({ date: new Date(d.date), qty: d.qty })), mets = calculateDemandMetrics(dataWithDateObjs);
                
                setRawDemandData(dataWithDateObjs); setMetrics(mets); 
                
                setHistory(prev => ({ 
                    ...prev, 
                    [key]: { 
                        params: { ...params, source: 'Sintética' }, 
                        seasonality, 
                        weeklySeasonality, 
                        metrics: mets, 
                        data: generatedData 
                    } 
                }));
            };

            const handleGenerateForecast = () => {
                if (!rawDemandData || rawDemandData.length === 0) return alert("Primero debes cargar o generar la demanda histórica base.");
                
                const mapeDecimal = parseFloat(forecastConfig.mape) / 100;
                let bucketSums = {}; 
                
                rawDemandData.forEach(d => {
                    let dateObj = d.date instanceof Date ? d.date : new Date(d.date);
                    let key = '';
                    if (forecastConfig.bucket === 'weekly') { 
                        let wInfo = getISOWeekAndYear(dateObj); 
                        key = `${wInfo.year}-W${wInfo.week.toString().padStart(2, '0')}`; 
                    } else { 
                        key = `${dateObj.getFullYear()}-${dateObj.getMonth().toString().padStart(2, '0')}`; 
                    }
                    if (!bucketSums[key]) bucketSums[key] = { sum: 0, dates: [] };
                    bucketSums[key].sum += d.qty; 
                    bucketSums[key].dates.push(dateObj.toISOString());
                });

                let dailyForecastMap = {};
                Object.keys(bucketSums).forEach(key => {
                    let actualSum = bucketSums[key].sum, 
                        sign = Math.random() < 0.5 ? 1 : -1, 
                        errorFactor = sign * mapeDecimal * (Math.random() * 2); 
                    let forecastSum = Math.max(0, actualSum * (1 + errorFactor)), 
                        daysInBucket = bucketSums[key].dates.length;
                    
                    let dailyVal = Math.round((forecastSum / daysInBucket) * 10) / 10;
                    
                    bucketSums[key].dates.forEach(dateStr => { dailyForecastMap[dateStr] = dailyVal; });
                });

                const generatedForecast = rawDemandData.map(d => {
                    let dateObj = d.date instanceof Date ? d.date : new Date(d.date);
                    return { date: dateObj, qty: dailyForecastMap[dateObj.toISOString()] || 0 };
                });
                
                setForecastData(generatedForecast);

                const updatedMetrics = calculateDemandMetrics(rawDemandData, generatedForecast);
                setMetrics(updatedMetrics);

                const historyKey = `${selectedProd}_${selectedNode}`;
                setHistory(prev => ({ 
                    ...prev, 
                    [historyKey]: { 
                        ...prev[historyKey], 
                        metrics: updatedMetrics, 
                        forecastParams: forecastConfig, 
                        forecastData: generatedForecast.map(d => ({ date: (d.date instanceof Date ? d.date : new Date(d.date)).toISOString(), qty: d.qty })) 
                    } 
                }));
            };

            const handleSaveAll = async () => {
                if (!selectedProd || !selectedNode || !rawDemandData) return;
                setIsSaving(true);
                try {
                    const payload = { 
                        type: 'demand', 
                        company: selectedCompany, // Enlace a la compañía
                        producto: selectedProd, 
                        bodega: selectedNode, 
                        parametros: { ...params, forecastBucket: forecastConfig.bucket, forecastMape: forecastConfig.mape }, 
                        data: rawDemandData.map(d => {
                            let dateObj = d.date instanceof Date ? d.date : new Date(d.date);
                            return { date: dateObj.toISOString().split('T')[0], qty: d.qty };
                        }) 
                    };
                    if (forecastData) { 
                        payload.forecastData = forecastData.map(d => {
                            let dateObj = d.date instanceof Date ? d.date : new Date(d.date);
                            return { date: dateObj.toISOString().split('T')[0], qty: d.qty };
                        }); 
                        payload.forecastParams = forecastConfig; 
                    }
                    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) }); alert("✅ Guardado en Sheets.");
                } catch (error) { alert("⚠️ Guardado localmente."); }
                setIsSaving(false);
            };

            // NUEVO BOTÓN: Eliminar historia
            const handleDeleteHistory = async () => {
                if (!confirm(`¿Estás seguro de ELIMINAR todo el historial y forecast para:\nProducto: ${selectedProd}\nBodega: ${selectedNode}?\n\n⚠️ Esta acción borrará los datos locales y en la nube.`)) return;
                setIsSaving(true);
                
                const key = `${selectedProd}_${selectedNode}`;
                setHistory(prev => {
                    const newHistory = { ...prev };
                    delete newHistory[key];
                    return newHistory;
                });
                setRawDemandData(null);
                setMetrics(null);
                setForecastData(null);
                
                try {
                    await fetch(SCRIPT_URL, { 
                        method: 'POST', 
                        body: JSON.stringify({ 
                            type: 'delete_demand', 
                            company: selectedCompany, 
                            producto: selectedProd, 
                            bodega: selectedNode 
                        }) 
                    });
                    alert("✅ Historial eliminado correctamente localmente y en Sheets.");
                } catch (e) {
                    alert("⚠️ Historial eliminado localmente, pero hubo error al comunicar con Sheets.");
                }
                setIsSaving(false);
            };
            return {
                params, setParams, seasonality, setSeasonality, weeklySeasonality, setWeeklySeasonality,
                rawDemandData, metrics, isSaving, importState, setImportState, // <-- AÑADIR setImportState AQUÍ
                showImportHelp, setShowImportHelp, showDistHelp, setShowDistHelp, forecastConfig, setForecastConfig, forecastData, timeView, setTimeView,
                getCalculatedEndDate, handlePosFloatBlur, handlePosIntBlur, handleFileUpload, processRealImport,
                handleGenerateSynthetic, handleGenerateForecast, handleSaveAll, handleDeleteHistory
            };
        }

        // --- COMPONENTE VISUAL: UI de Demanda ---
        function Paso2Demanda({ products, nodes, history, setHistory, scenarios, selectedCompany, setSelectedCompany, selectedProd, setSelectedProd, selectedNode, setSelectedNode, logistics }) {
            const {
                params, setParams, seasonality, setSeasonality, 
                weeklySeasonality, setWeeklySeasonality, 
                rawDemandData, metrics, isSaving, importState, setImportState, // <-- AÑADIR setImportState AQUÍ
                showImportHelp, setShowImportHelp, showDistHelp, setShowDistHelp, forecastConfig, setForecastConfig, forecastData, timeView, setTimeView,
                getCalculatedEndDate, handlePosFloatBlur, handlePosIntBlur, handleFileUpload, processRealImport,
                handleGenerateSynthetic, handleGenerateForecast, handleSaveAll, handleDeleteHistory
            } = useDemandManager({ products, nodes, history, setHistory, scenarios, selectedProd, selectedNode, selectedCompany });

            const chartRef = useRef(null); 

            useEffect(() => {
                if (!rawDemandData || !chartRef.current) return;
                let labelsAxis0 = [], labelsAxis1 = [], fullTooltipLabels = [], dataHist = [], dataFore = [], lastMonth = null, lastYear = null, groups = [];
                rawDemandData.forEach((d, i) => {
                    let dateObj = d.date, day = dateObj.getDate().toString().padStart(2, '0'), month = dateObj.getMonth(), year = dateObj.getFullYear();
                    let monthStr = dateObj.toLocaleDateString('es-ES', { month: 'short' }); monthStr = monthStr.charAt(0).toUpperCase() + monthStr.slice(1);
                    let key = '';
                    if (timeView === 'daily') key = dateObj.toISOString().split('T')[0];
                    else if (timeView === 'weekly') { let { week, year: wYear } = getISOWeekAndYear(dateObj); key = `${wYear}-W${week.toString().padStart(2, '0')}`; } 
                    else key = `${year}-${month.toString().padStart(2, '0')}`;

                    let g = groups.find(g => g.key === key);
                    if (!g) {
                        let lbl0 = '', lbl1 = '';
                        if (timeView === 'daily') { lbl0 = day; lbl1 = (month !== lastMonth || i === 0) ? monthStr + ((year !== lastYear || i===0) ? `\n${year}` : '') : ''; lastMonth = month; lastYear = year; } 
                        else if (timeView === 'weekly') { let { week, year: wYear } = getISOWeekAndYear(dateObj); lbl0 = `Sem ${week}`; lbl1 = (month !== lastMonth || groups.length === 0) ? monthStr + ((wYear !== lastYear || groups.length === 0) ? `\n${wYear}` : '') : ''; lastMonth = month; lastYear = wYear; } 
                        else { lbl0 = monthStr; lbl1 = (year !== lastYear || groups.length === 0) ? year.toString() : ''; lastYear = year; }
                        g = { key, lbl0, lbl1, qtyHist: 0, qtyFore: 0, rawDate: dateObj }; groups.push(g);
                    }
                    g.qtyHist += d.qty; if (forecastData && forecastData[i]) g.qtyFore += forecastData[i].qty;
                });

                groups.forEach(g => {
                    labelsAxis0.push(g.lbl0); labelsAxis1.push(g.lbl1);
                    let tLabel = '';
                    if (timeView === 'daily') tLabel = formatShortDate(g.rawDate.toISOString()); 
                    else if (timeView === 'weekly') tLabel = `Semana ${g.key.split('-W')[1]}, ${g.key.split('-')[0]}`;
                    else { const parts = g.key.split('-'); tLabel = `${MONTHS[parseInt(parts[1], 10)]} ${parts[0]}`; }
                    fullTooltipLabels.push(tLabel); dataHist.push(g.qtyHist); if (forecastData) dataFore.push(g.qtyFore);
                });

                let myChart = echarts.getInstanceByDom(chartRef.current) || echarts.init(chartRef.current);
                const option = {
                    tooltip: { 
                        confine: true, trigger: 'axis', backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#ea580c', textStyle: { color: '#333' }, 
                        formatter: p => {
                            if(!p || !p.length) return '';
                            let html = `<div style="text-align:center;"><strong style="color:#1e3a8a; font-size:12px; font-weight:normal;">${fullTooltipLabels[p[0].dataIndex]}</strong><br/>`;
                            p.forEach(serie => { let color = serie.seriesName === 'Forecast' ? '#3b82f6' : '#ea580c'; html += `${serie.marker} ${serie.seriesName}: <b style="color:${color}; font-size:13px; font-weight:500;">${Number(serie.data).toFixed(1)}</b><br/>`; });
                            return html + '</div>';
                        } 
                    },
                    legend: { show: forecastData ? true : false, data: ['Consumo Real', 'Forecast'], top: 0, textStyle: {fontSize: 10} },
                    toolbox: { show: true, feature: { dataZoom: { yAxisIndex: 'none', title: { zoom: 'Zoom', back: 'Atrás' } }, restore: { title: 'Restaurar' } }, right: 15, top: 0 },
                    grid: { left: '2%', right: '2%', bottom: 40, top: '15%', containLabel: true },
                    xAxis: [
                        { type: 'category', data: labelsAxis0, axisLabel: { interval: 'auto', hideOverlap: true, color: '#6b7280', fontSize: 10, fontWeight: 'normal' }, axisTick: { alignWithLabel: true }, axisLine: { show: true, lineStyle: { color: '#e5e7eb' } } },
                        { type: 'category', data: labelsAxis1, position: 'bottom', offset: 14, axisLabel: { interval: 0, align: 'center', lineHeight: 12, color: '#4b5563', fontSize: 10, fontWeight: 'normal' }, axisTick: { show: false }, axisLine: { show: false } }
                    ],
                    yAxis: { type: 'value', splitLine: { lineStyle: { color: '#e5e7eb', type: 'dashed' } } },
                    dataZoom: [{ type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 }],
                    series: [
                        { name: 'Consumo Real', data: dataHist, type: 'bar', itemStyle: { color: '#ea580c', borderRadius: [2, 2, 0, 0] }, barMaxWidth: 20 },
                        ...(forecastData ? [{ name: 'Forecast', data: dataFore, type: 'line', itemStyle: { color: '#3b82f6' }, lineStyle: { width: 2, type: 'dashed' }, symbol: 'circle', symbolSize: 4 }] : [])
                    ]
                };
                myChart.setOption(option, true);
                const resize = () => myChart.resize(); window.addEventListener('resize', resize); return () => window.removeEventListener('resize', resize);
            }, [rawDemandData, forecastData, timeView]);

            // LÓGICA DE CASCADA (MULTI-TENANT)
            const companies = [...new Set((logistics || []).map(l => l.company || 'WA'))];
            if (companies.length === 0 && !companies.includes('WA')) companies.push('WA');

            const availableProducts = [...new Set((logistics || []).filter(l => (l.company || 'WA') === (selectedCompany || 'WA')).map(l => l.prodCode))];
            const availableNodes = (logistics || []).filter(l => (l.company || 'WA') === (selectedCompany || 'WA') && l.prodCode === selectedProd).map(l => l.nodeCode);

            return (
                <div className="bg-white p-3 rounded shadow border-t-4 border-green-500 h-full flex flex-col overflow-hidden relative">
                    <div className="bg-green-50 border border-green-200 p-2 rounded mb-2 flex flex-col md:flex-row gap-2 items-end flex-shrink-0">
                        <div className="w-full md:w-1/4">
                            <label className="block text-[10px] font-medium mb-0.5">Compañía</label>
                            <select value={selectedCompany || 'WA'} onChange={e=>{setSelectedCompany(e.target.value); setSelectedProd(''); setSelectedNode('');}} className="w-full border p-1 rounded text-[11px] font-medium bg-white text-green-900 border-green-300">
                                {companies.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </div>
                        <div className="w-full md:w-1/4">
                            <label className="block text-[10px] font-medium mb-0.5">Producto</label>
                            <select value={selectedProd} onChange={e=>{setSelectedProd(e.target.value); setSelectedNode('');}} className="w-full border p-1 rounded text-[11px] font-medium bg-white text-green-900 border-green-300">
                                <option value="">-- Elige --</option>
                                {availableProducts.map(pCode => <option key={pCode} value={pCode}>{pCode}</option>)}
                            </select>
                        </div>
                        <div className="w-full md:w-1/4">
                            <label className="block text-[10px] font-medium mb-0.5">Bodega (Enlazada)</label>
                            <select disabled={!selectedProd} value={selectedNode} onChange={e=>{setSelectedNode(e.target.value);}} className="w-full border p-1 rounded text-[11px] font-medium bg-white text-green-900 border-green-300">
                                <option value="">-- Elige --</option>
                                {availableNodes.map(nCode => <option key={nCode} value={nCode}>{nCode}</option>)}
                            </select>
                        </div>
                        <div className="w-full md:w-1/4 flex gap-1 items-end">
                            {!!history[`${selectedProd}_${selectedNode}`] ? (
                                <div className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-[10px] flex-grow font-medium text-center border border-blue-300 shadow-sm flex flex-col justify-center h-[26px]">
                                    <span>✅ {history[`${selectedProd}_${selectedNode}`].params?.source === 'Real Importada' ? 'Consumo Real' : 'Demanda Sintética'}</span>
                                </div>
                            ) : <div className="bg-gray-100 text-gray-500 px-2 py-1 rounded text-[10px] flex-grow text-center italic h-[26px] flex flex-col justify-center">Sin Historia</div>}
                        </div>
                    </div>

                    {!selectedProd || !selectedNode ? (
                        <div className="flex-grow flex items-center justify-center text-gray-400 border-2 border-dashed border-gray-200 rounded-lg">Selecciona Compañía, Producto y Bodega.</div>
                    ) : (
                        <div className="flex flex-col md:flex-row gap-3 flex-grow overflow-hidden">
                            {/* --- PANEL DE CONFIGURACIÓN --- */}
                            <div className="w-full md:w-[28%] bg-gray-50 p-2 rounded border flex flex-col shadow-sm overflow-y-auto max-h-[85vh]">
                                {/* Importar CSV Compacto */}
                                <div className="flex justify-between items-center gap-1 mb-2 border-b border-gray-200 pb-2 flex-shrink-0">
                                    <label className="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-1.5 rounded text-[11px] border border-indigo-200 cursor-pointer text-center shadow-sm transition">
                                        📥 Importar CSV Real
                                        <input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" />
                                    </label>
                                    <button onClick={() => setShowImportHelp(!showImportHelp)} className={`px-2 py-1 rounded border transition text-[11px] font-bold ${showImportHelp ? 'bg-indigo-200 text-indigo-800 border-indigo-300' : 'bg-white text-gray-400 hover:bg-gray-100 border-gray-200'}`} title="Ver reglas">{showImportHelp ? '✖' : 'ⓘ'}</button>
                                </div>
                                {showImportHelp && (
                                    <div className="bg-indigo-50 border border-indigo-200 text-indigo-800 p-2 rounded text-[10px] shadow-inner mb-2 animate-fadeIn">
                                        <strong className="block mb-0.5 border-b border-indigo-200 pb-0.5 font-bold">📋 Reglas del Archivo CSV:</strong>
                                        <ul className="list-disc pl-3 space-y-0.5 mt-1">
                                            <li><strong>Columnas:</strong> Producto, Bodega, Fecha, Cantidad, Tipo (Opcional).</li>
                                            <li><strong>Fecha:</strong> Formato YYYYMMDD o YYYY-MM-DD.</li>
                                        </ul>
                                    </div>
                                )}

                                <h2 className="text-xs font-bold mb-2 text-green-700 border-b pb-1 flex-shrink-0">Generación Sintética</h2>
                                
                                {/* ROW 1: Fechas y Meses */}
                                <div className="grid grid-cols-3 gap-1.5 mb-2 flex-shrink-0">
                                    <div><label className="block text-[10px] font-medium mb-0.5 text-gray-600">Inicio</label><input type="date" value={params.startDate} onChange={e=>setParams({...params, startDate:e.target.value})} className="w-full border p-1 rounded text-[10px] bg-white" /></div>
                                    <div><label className="block text-[10px] font-medium mb-0.5 text-gray-600">Meses</label><input type="number" min="1" max="24" value={params.months} onChange={e=>setParams({...params, months:e.target.value})} onBlur={e=>handlePosIntBlur(e,'months')} className="w-full border p-1 rounded text-[10px] bg-white font-medium" /></div>
                                    <div><label className="block text-[10px] font-medium mb-0.5 text-gray-500">Fin</label><div className="w-full bg-gray-200 text-center text-[10px] py-1 rounded font-mono font-bold text-gray-700 overflow-hidden text-ellipsis whitespace-nowrap px-0.5" title={getCalculatedEndDate()}>{getCalculatedEndDate()}</div></div>
                                </div>

                                {/* ROW 2: Distribución y Factor */}
                                <div className="mb-2 flex-shrink-0">
                                    <div className="flex justify-between items-center mb-0.5">
                                        <label className="text-[10px] font-medium text-gray-600">Distribución Probabilística</label>
                                        <button onClick={() => setShowDistHelp(!showDistHelp)} className={`px-1.5 py-0.5 rounded border transition text-[9px] font-bold ${showDistHelp ? 'bg-indigo-200 text-indigo-800 border-indigo-300' : 'bg-white text-gray-400 hover:bg-gray-100 border-gray-200'}`} title="Ayuda sobre distribuciones">{showDistHelp ? '✖' : 'ⓘ Ayuda'}</button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-1.5">
                                        <div>
                                            <select value={params.distModel} onChange={e=>setParams({...params, distModel:e.target.value})} className="w-full border p-1 rounded text-[10px] bg-white font-medium">
                                                <option value="normal">Normal Trunc.</option>
                                                <option value="poisson">Poisson</option>
                                                <option value="uniform">Uniforme</option>
                                                <option value="exponential">Exponencial</option>
                                                <option value="bernoulli">Bernoulli (Fija)</option>
                                            </select>
                                        </div>
                                        {params.months > 12 ? (
                                            <div className="bg-blue-50 border border-blue-200 rounded px-1 pb-1 pt-0.5"><label className="block text-[9px] font-bold text-blue-700 mb-0.5">Factor Año 2</label><input type="number" step="0.01" value={params.year2Factor} onChange={e=>setParams({...params, year2Factor:e.target.value})} onBlur={e=>handlePosFloatBlur(e,'year2Factor')} className="w-full border p-0.5 rounded text-[10px] font-medium" /></div>
                                        ) : <div />}
                                    </div>
                                    {showDistHelp && (
                                        <div className="bg-indigo-50 border border-indigo-200 text-indigo-800 p-2.5 rounded text-[9px] shadow-inner mt-1.5 animate-fadeIn">
                                            <strong className="block mb-1 border-b border-indigo-200 pb-0.5 font-bold">Guía de Distribuciones:</strong>
                                            <ul className="space-y-1.5 mt-1 leading-snug">
                                                <li><b className="font-bold">Normal Trunc.:</b> Clásica campana de Gauss. Ideal para consumos regulares y altamente predecibles.</li>
                                                <li><b className="font-bold">Poisson:</b> Eventos aleatorios independientes. Excelente para repuestos o ventas estables de baja rotación.</li>
                                                <li><b className="font-bold">Uniforme:</b> Cualquier valor entre Mín y Máx tiene igual probabilidad. Útil sin patrones claros.</li>
                                                <li><b className="font-bold">Exponencial:</b> Muchos días de consumo bajo y picos esporádicos altísimos. Ideal para <i>Lumpy Demand</i>.</li>
                                                <li><b className="font-bold">Bernoulli (Fija):</b> Demanda binaria; ocurre o no. El tamaño del pedido siempre es exacto cuando ocurre.</li>
                                            </ul>
                                        </div>
                                    )}
                                </div>

                                {/* ROW 3: ADU y ADI */}
                                <div className="grid grid-cols-2 gap-1.5 mb-2 flex-shrink-0">
                                    <div><label className="block text-[10px] font-bold text-blue-800 mb-0.5">ADU Global</label><input type="number" step="0.1" value={params.adu} onChange={e=>setParams({...params, adu:e.target.value})} onBlur={e=>handlePosFloatBlur(e,'adu')} className="w-full border border-blue-300 p-1 rounded text-xs font-bold text-blue-900 bg-blue-50" /></div>
                                    <div><label className="block text-[10px] font-medium text-gray-600 mb-0.5">ADI (Días Prom)</label><input type="number" step="0.1" value={params.adi} onChange={e=>setParams({...params, adi:e.target.value})} onBlur={e=>handlePosFloatBlur(e,'adi')} className="w-full border p-1 rounded text-xs bg-white font-medium" /></div>
                                </div>

                                {/* ROW 4: Desviación y Límites */}
                                <div className="grid grid-cols-3 gap-1.5 mb-2 flex-shrink-0">
                                    <div><label className="block text-[10px] font-medium mb-0.5 text-gray-600">σ (Desv)</label><input type="number" step="0.1" value={params.stdDev} onChange={e=>setParams({...params, stdDev:e.target.value})} onBlur={e=>handlePosFloatBlur(e,'stdDev')} className="w-full border p-1 rounded text-[10px] italic text-gray-500 bg-white" placeholder="Auto" /></div>
                                    <div><label className="block text-[10px] font-medium mb-0.5 text-gray-600">Mín Qty</label><input type="number" value={params.minQty} onChange={e=>setParams({...params, minQty:e.target.value})} onBlur={e=>handlePosFloatBlur(e,'minQty')} className="w-full border p-1 rounded text-[10px] bg-white" placeholder="Auto" /></div>
                                    <div><label className="block text-[10px] font-medium mb-0.5 text-gray-600">Máx Qty</label><input type="number" value={params.maxQty} onChange={e=>setParams({...params, maxQty:e.target.value})} onBlur={e=>handlePosFloatBlur(e,'maxQty')} className="w-full border p-1 rounded text-[10px] bg-white" placeholder="Auto" /></div>
                                </div>

                                {/* Intrasemanal Compacto */}
                                <div className="mb-2 border-t border-gray-200 pt-2 flex-shrink-0">
                                    <label className="flex items-center gap-1.5 text-[10px] font-bold text-gray-700 cursor-pointer hover:text-blue-600 transition-colors mb-1">
                                        <input type="checkbox" checked={params.useWeeklySeasonality === 'Si'} onChange={e => setParams({...params, useWeeklySeasonality: e.target.checked ? 'Si' : 'No'})} className="cursor-pointer w-3.5 h-3.5" /> 
                                        Estacionalidad Intrasemanal
                                    </label>
                                    {params.useWeeklySeasonality === 'Si' && (
                                        <div className="bg-gray-50 p-1.5 rounded border border-gray-200 shadow-inner animate-fadeIn">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="text-[9px] font-bold text-gray-600">Pesos diarios (%)</span>
                                                <span className={`text-[9px] font-bold ${weeklySeasonality.reduce((a,b)=>a+(parseFloat(b)||0),0) === 100 ? 'text-green-600' : 'text-red-500'}`}>
                                                    Tot: {weeklySeasonality.reduce((a,b)=>a+(parseFloat(b)||0),0)}%
                                                </span>
                                            </div>
                                            <div className="grid grid-cols-7 gap-0.5">
                                                {['L','M','X','J','V','S','D'].map((day, idx) => (
                                                    <div key={day} className="text-center">
                                                        <span className="text-[8px] font-bold text-gray-500 block mb-0.5">{day}</span>
                                                        <input type="number" min="0" value={weeklySeasonality[idx]} onChange={e => { let newW = [...weeklySeasonality]; newW[idx] = e.target.value; setWeeklySeasonality(newW); }} className="w-full border text-[9px] text-center rounded p-0.5 font-medium bg-white" />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <button onClick={handleGenerateSynthetic} className="w-full bg-green-600 text-white font-bold py-1.5 rounded shadow-sm hover:bg-green-700 transition text-[11px] flex-shrink-0">▶ Generar Sintética</button>
                                
                                <h2 className="text-xs font-bold mt-2.5 mb-1.5 text-blue-700 border-b pb-0.5 border-blue-200 flex-shrink-0">Plan Forecast</h2>
                                <div className="grid grid-cols-2 gap-1.5 mb-2 flex-shrink-0">
                                    <div><label className="block text-[10px] font-medium mb-0.5 text-gray-600">Cubo Tiempo</label><select value={forecastConfig.bucket} onChange={e=>setForecastConfig({...forecastConfig, bucket: e.target.value})} className="w-full border p-1 rounded text-[10px] bg-white font-medium"><option value="weekly">Semanal</option><option value="monthly">Mensual</option></select></div>
                                    <div><label className="block text-[10px] font-medium mb-0.5 text-gray-600">MAPE (%)</label><input type="number" min="0" value={forecastConfig.mape} onChange={e=>setForecastConfig({...forecastConfig, mape: e.target.value})} className="w-full border p-1 rounded text-xs bg-white font-bold text-blue-900" /></div>
                                </div>
                                <button onClick={handleGenerateForecast} disabled={!rawDemandData} className="w-full bg-blue-600 text-white font-bold py-1.5 rounded shadow-sm hover:bg-blue-700 transition text-[11px] disabled:bg-gray-400 flex-shrink-0">📊 Superponer Forecast</button>

                                {/* --- BOTONES CORREGIDOS CON "ELIMINAR" --- */}
